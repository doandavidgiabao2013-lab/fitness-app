let S;try{S=migrate(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=def()}

const dsave=debounce(save,300);

function mHabit(id){const x=id?S.habits.list.find(h=>h.id===id):null;
 return`<h3>${x?'Habit bearbeiten':'+ Neues Habit'}</h3>
 <input type="hidden" id="habId" value="${x?x.id:''}">
 <label><small>Name</small><input id="habName" maxlength="30" value="${x?esc(x.name):''}" placeholder="z. B. Wasser trinken"></label>
 <small class="mu" style="display:block;margin:8px 0 4px">Emoji</small>
 <div class="emo">${EMO.map(e=>`<button type="button" class="${x&&x.emoji===e?'on':''}" data-pick-emoji="${e}" aria-label="Emoji ${e}">${e}</button>`).join('')}</div>
 <input type="hidden" id="habEmoji" value="${x?esc(x.emoji):'✅'}">
 <label><small>Kategorie</small><select id="habCat">${CATS.map(c=>`<option ${x&&x.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
 <label><small>Uhrzeit (optional)</small><input type="time" id="habTime" value="${x?x.time:''}"></label>
 <label><small>Einheit</small><select id="habUnit"><option value="check" ${!x||x.unit==='check'?'selected':''}>Abhaken</option>${Object.keys(STEP).map(u=>`<option value="${u}" ${x&&x.unit===u?'selected':''}>${UL[u]}</option>`).join('')}</select></label>
 <label><small>Tagesziel (bei Mengeneinheit)</small><input id="habTarget" inputmode="decimal" value="${x?x.target:0}"></label>
 <label><small>Häufigkeit</small><select id="habFreq"><option value="daily" ${!x||x.freq==='daily'?'selected':''}>Täglich</option><option value="weekly" ${x&&x.freq==='weekly'?'selected':''}>X-mal pro Woche</option></select></label>
 <label><small>Ziel pro Woche (falls X-mal/Woche)</small><input id="habWTarget" type="number" value="${x?x.wtarget:3}"></label>
 <button class="b" style="margin-top:10px" data-action="habsave">Speichern</button>`}
function mDay(k){const logs=S.workoutLogs.filter(l=>l.date===k),note=(S.calendar[k]||{}).note||'';
 return`<h3>${k}</h3>${logs.length?logs.map(l=>`<div class="fr"><span>${esc(l.name)}</span><span class="mu">Vol. ${Math.round(cv(volOf(l),gu()))} ${gu()}</span></div>`).join(''):'<div class="mu">Kein Workout an diesem Tag.</div>'}
 <label><small>Notiz</small><textarea data-change="daynote" data-date="${k}" rows="3">${esc(note)}</textarea></label>`}
/* ---------- Rendering ---------- */
const NAVI=[['home','🏠','Home'],['workouts','🏋️','Workouts'],['habits','✅','Habits'],['calendar','📅','Kalender'],['progress','📈','Progress']];
function renderNav(){$('nav').innerHTML=NAVI.map(([id,ic,lb])=>`<button class="${ui.tab===id?'on':''}" data-action="nav" data-id="${id}" aria-label="${lb}"><span>${ic}</span>${lb}</button>`).join('')}
function applyTheme(){document.documentElement.setAttribute('data-theme',S.settings.theme==='light'?'light':'dark')}
function openModal(html){$('sheet').innerHTML=html+'<div style="margin-top:14px"><button class="b b2" data-action="close">Schließen</button></div>';$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');$('sheet').innerHTML=''}
function render(){renderNav();const views={home:vHome,workouts:vWork,habits:vHab,calendar:vCal,progress:vProg};$('main').innerHTML=(views[ui.tab]||vHome)();applyTheme();renderTimerBar()}
function tickClock(){const n=new Date(),c=$('clk'),d=$('dt');if(c)c.textContent=pad(n.getHours())+':'+pad(n.getMinutes());if(d)d.textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}
setInterval(tickClock,1000);
/* ---------- Timer (Pausen-Countdown) ---------- */
function startTimer(sec){sec=sec||S.settings.rest||90;S.timer={orig:sec*1000,dur:sec*1000,end:Date.now()+sec*1000,paused:null,fired:false};save();renderTimerBar()}
function pauseTimer(){if(!S.timer||S.timer.end==null)return;S.timer.paused=Math.max(0,S.timer.end-Date.now());S.timer.end=null;save();renderTimerBar()}
function resumeTimer(){if(!S.timer||S.timer.paused==null)return;S.timer.end=Date.now()+S.timer.paused;S.timer.paused=null;save();renderTimerBar()}
function hideTimerBar(){const b=$('tbar');b.classList.remove('show','flash');b.innerHTML=''}
function renderTimerBar(){const t=S.timer,b=$('tbar');if(!t){hideTimerBar();return}
 b.classList.add('show');
 const remaining=t.paused!=null?t.paused:Math.max(0,t.end-Date.now()),sc=Math.ceil(remaining/1000),mm=pad(Math.floor(sc/60)),ss=pad(sc%60);
 b.innerHTML=`<div class="row sp"><b id="tt">⏱ ${mm}:${ss}</b><div class="row"><button class="b b2 sm" data-action="tplus">+15s</button><button class="b b2 sm" data-action="${t.paused!=null?'tresume':'tpause'}" aria-label="${t.paused!=null?'Fortsetzen':'Pausieren'}">${t.paused!=null?'▶':'⏸'}</button><button class="b bd sm" data-action="tskip" aria-label="Timer beenden">✕</button></div></div>`}
function timerTick(){const t=S.timer;if(!t||t.paused!=null)return;
 const remaining=t.end-Date.now();
 if(remaining<=0&&!t.fired){t.fired=true;save();const b=$('tbar');if(b)b.classList.add('flash');toast('⏱ Pause vorbei!');if(navigator.vibrate){try{navigator.vibrate(200)}catch(e){}}
  /* Nach der kurzen Blink-Phase Timer komplett zurücksetzen, statt die
     Bar unbegrenzt bei 00:00 stehen zu lassen. */
  setTimeout(()=>{if(S.timer&&S.timer.fired){S.timer=null;save()}hideTimerBar()},3200)}
 const el=$('tt');if(el){const sc=Math.max(0,Math.ceil(remaining/1000)),mm=pad(Math.floor(sc/60)),ss=pad(sc%60);el.textContent='⏱ '+mm+':'+ss}}
setInterval(timerTick,250);
/* ---------- Workout actions ---------- */
function startWorkout(rid){if(S.activeWorkout){toast('Es läuft bereits ein Workout.');ui.tab='workouts';ui.sub='log';render();return}
 let name='Freies Workout',exs=[];
 if(rid!=='free'){const r=S.routines.find(x=>x.id===rid);if(!r){toast('Routine nicht gefunden');return}
  name=r.name;exs=r.exercises.map(e=>({name:e.name,unit:e.unit,bw:e.bw,sets:Array.from({length:e.sets},()=>({w:e.w,r:e.reps,rpe:null,note:'',done:false,skip:false}))}))}
 S.activeWorkout={date:dk(),start:Date.now(),rid,name,exs};save();ui.tab='workouts';ui.sub='log';render();toast('Workout gestartet 💪')}
function finishWorkout(){const a=S.activeWorkout;if(!a)return;
 if(!a.exs.some(e=>e.sets.some(s=>s.done))){toast('Noch keine Sätze abgeschlossen.');return}
 S.workoutLogs.push({id:uid(),date:a.date,name:a.name,start:a.start,end:Date.now(),exs:a.exs});
 S.activeWorkout=null;S.timer=null;save();hideTimerBar();ui.sub='history';render();toast('Workout gespeichert ✅')}
/* ---------- Event delegation ---------- */
function handleClick(e){
 const emo=e.target.closest('[data-pick-emoji]');
 if(emo){$('habEmoji').value=emo.getAttribute('data-pick-emoji');emo.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));emo.classList.add('on');return}
 const b=e.target.closest('[data-action]');if(!b)return;
 const ds=b.dataset,id=ds.id,today=dk();
 switch(ds.action){
  case 'nav': ui.tab=id; render(); break;
  case 'sub': ui.sub=id; if(ds.tab)ui.tab=ds.tab; render(); break;
  case 'hsub': ui.hs=id; render(); break;
  case 'gear': openModal(mSettings()); break;
  case 'close': closeModal(); break;
  case 'start': startWorkout(id); break;
  case 'finish': finishWorkout(); break;
  case 'cancelw': if(confirm('Workout wirklich abbrechen?')){S.activeWorkout=null;S.timer=null;save();hideTimerBar();ui.sub='today';render()} break;
  case 'water': S.water[today]=Math.max(0,fmt((S.water[today]||0)+parseFloat(id))); save(); render(); break;
  case 'sleep': S.sleep[today]=Math.max(0,(S.sleep[today]||0)+parseInt(id)); save(); render(); break;
  case 'steps': S.steps[today]=Math.max(0,(S.steps[today]||0)+parseInt(id)); save(); render(); break;
  case 'dtog':{const i=+id;ui.days=ui.days.includes(i)?ui.days.filter(x=>x!==i):[...ui.days,i];ui.rest=ui.rest.filter(x=>x!==i);render();break}
  case 'rtog':{const i=+id;if(ui.days.includes(i))break;ui.rest=ui.rest.includes(i)?ui.rest.filter(x=>x!==i):[...ui.rest,i];render();break}
  case 'addr':{const nm=($('rn').value||'').trim();if(!nm){toast('Bitte Namen eingeben');break}
   S.routines.push({id:uid(),name:nm,days:[...ui.days],rest:[...ui.rest],exercises:[]});ui.days=[];ui.rest=[];save();render();toast('Routine angelegt');break}
  case 'delr': if(confirm('Routine wirklich löschen?')){S.routines=S.routines.filter(r=>r.id!==id);save();render()} break;
  case 'delex':{const r=S.routines.find(x=>x.id===id);if(r){r.exercises=r.exercises.filter(e=>e.id!==ds.ex);save();render()}break}
  case 'exmodal': openModal(mExercise(id)); break;
  case 'exadd':{const target=$('exTarget').value,name=($('exName').value||'').trim();if(!name){toast('Bitte Namen eingeben');break}
   const unit=$('exUnit').value,bwm=$('exBw').value;
   if(target==='active'){const a=S.activeWorkout;if(!a)break;a.exs.push({name,unit,bw:bwm,sets:[{w:0,r:0,rpe:null,note:'',done:false,skip:false}]})}
   else{const r=S.routines.find(x=>x.id===target);if(!r)break;const sets=Math.max(1,parseInt($('exSets').value)||1),reps=Math.max(0,parseInt($('exReps').value)||0),wv=fk($('exW').value,gu()),w=wv==null?0:wv;r.exercises.push({id:uid(),name,unit,bw:bwm,w,sets,reps})}
   save();closeModal();render();toast('Übung hinzugefügt');break}
  case 'aset':{const a=S.activeWorkout,ex=a.exs[+ds.ex],last=ex.sets[ex.sets.length-1];ex.sets.push({w:last?last.w:0,r:last?last.r:0,rpe:null,note:'',done:false,skip:false});save();render();break}
  case 'axdel':{const a=S.activeWorkout;a.exs.splice(+ds.ex,1);save();render();break}
  case 'done':{const a=S.activeWorkout,ex=a.exs[+ds.ex],s=ex.sets[+ds.id];s.done=!s.done;if(s.done){s.skip=false;startTimer()}save();render();break}
  case 'skip':{const a=S.activeWorkout,ex=a.exs[+ds.ex],s=ex.sets[+ds.id];s.skip=!s.skip;if(s.skip)s.done=false;save();render();break}
  case 'habmodal': openModal(mHabit(null)); break;
  case 'edith': openModal(mHabit(id)); break;
  case 'delh': if(confirm('Habit wirklich löschen?')){S.habits.list=S.habits.list.filter(h=>h.id!==id);save();render()} break;
  case 'habsave':{const hid=$('habId').value,name=($('habName').value||'').trim();if(!name){toast('Bitte Namen eingeben');break}
   const data={name,emoji:$('habEmoji').value||'✅',cat:oneOf($('habCat').value,CATS,'Anytime'),time:$('habTime').value||'',unit:oneOf($('habUnit').value,['check',...Object.keys(STEP)],'check'),target:Math.max(0,num($('habTarget').value,0)),freq:oneOf($('habFreq').value,['daily','weekly'],'daily'),wtarget:Math.min(7,Math.max(1,parseInt($('habWTarget').value)||3))};
   if(hid){const h=S.habits.list.find(x=>x.id===hid);if(h)Object.assign(h,data)} else S.habits.list.push({id:uid(),...data});
   save();closeModal();render();toast('Gespeichert');break}
  case 'hstep':{const x=S.habits.list.find(h=>h.id===id);if(!x)break;const k=ui.hd,cur=hv(k,x.id)||0,q=STEP[x.unit]||1,dir=+ds.dir;
   S.habits.log[k]=S.habits.log[k]||{};S.habits.log[k][x.id]=Math.max(0,+(cur+q*dir).toFixed(2));save();render();break}
  case 'htog':{const k=ui.hd;S.habits.log[k]=S.habits.log[k]||{};S.habits.log[k][id]=!S.habits.log[k][id];save();render();break}
  case 'fadd':{const i=+id,m=MEALS[i],nEl=$('fn'+i),gEl=$('fg'+i),name=(nEl.value||'').trim(),g=Math.max(0,num(gEl.value,0));if(!name){toast('Bitte Namen eingeben');break}
   S.food[ui.fd]=S.food[ui.fd]||{};S.food[ui.fd][m]=S.food[ui.fd][m]||[];S.food[ui.fd][m].push({id:uid(),name,g,done:true});save();render();break}
  case 'fdone':{const arr=(S.food[ui.fd]&&S.food[ui.fd][ds.meal])||[],x=arr.find(y=>y.id===id);if(x)x.done=true;save();render();break}
  case 'fdel':{if(S.food[ui.fd]&&S.food[ui.fd][ds.meal])S.food[ui.fd][ds.meal]=S.food[ui.fd][ds.meal].filter(y=>y.id!==id);save();render();break}
  case 'day': openModal(mDay(ds.date)); break;
  case 'cm': ui.cm+=parseInt(id); render(); break;
  case 'tpause': pauseTimer(); break;
  case 'tresume': resumeTimer(); break;
  case 'tskip': S.timer=null; save(); hideTimerBar(); break;
  case 'tplus': if(S.timer){S.timer.dur+=15000;if(S.timer.end!=null)S.timer.end+=15000;else S.timer.paused=(S.timer.paused||0)+15000;save();renderTimerBar()} break;
  case 'export':{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='momentum-backup-'+dk()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup exportiert');break}
  case 'import':{const f=$('impfile'); if(f)f.click(); break}
  case 'dellog': if(confirm('Diesen Workout-Eintrag wirklich löschen?')){S.workoutLogs=S.workoutLogs.filter(l=>l.id!==id);save();render();toast('Eintrag gelöscht')} break;
 }
}
function onDataChange(e){const el=e.target,dc=el.dataset&&el.dataset.change;if(!dc)return;const u=gu();
 switch(dc){
  case 'sw':{const a=S.activeWorkout;if(!a)break;const ex=a.exs[+el.dataset.ex],s=ex.sets[+el.dataset.id],v=fk(el.value,u);if(v!=null)s.w=v;dsave();break}
  case 'sr':{const a=S.activeWorkout;if(!a)break;const ex=a.exs[+el.dataset.ex],s=ex.sets[+el.dataset.id];if(el.value!=='')s.r=Math.max(0,parseInt(el.value)||0);dsave();break}
  case 'srpe':{const a=S.activeWorkout;if(!a)break;const ex=a.exs[+el.dataset.ex],s=ex.sets[+el.dataset.id],raw=String(el.value).trim();if(raw===''){s.rpe=null}else{const v=parseFloat(raw.replace(',','.'));if(isFinite(v))s.rpe=Math.min(10,Math.max(0,Math.round(v*2)/2))}dsave();break}
  case 'snote':{const a=S.activeWorkout;if(!a)break;const ex=a.exs[+el.dataset.ex],s=ex.sets[+el.dataset.id];s.note=el.value.slice(0,140);dsave();break}
  case 'hdate': ui.hd=el.value||dk(); render(); break;
  case 'fdate': ui.fd=el.value||dk(); render(); break;
  case 'hval':{const x=S.habits.list.find(h=>h.id===el.dataset.id);if(!x)break;const k=ui.hd;S.habits.log[k]=S.habits.log[k]||{};if(el.value!=='')S.habits.log[k][x.id]=Math.max(0,num(el.value,0));dsave();hupd(x.id);break}
  case 'daynote':{const k=el.dataset.date;S.calendar[k]=S.calendar[k]||{note:''};S.calendar[k].note=el.value;dsave();break}
  case 'unit': S.settings.unit=el.value; save(); render(); break;
  case 'theme': S.settings.theme=el.value; applyTheme(); save(); break;
  case 'rest': if(el.value!=='')S.settings.rest=Math.min(600,Math.max(5,parseInt(el.value)||90)); dsave(); break;
  case 'bw':{const v=fk(el.value,u);if(v!=null){S.bodyweight[dk()]=v}dsave();break}
  case 'goal': if(el.value!=='')S.settings.goal=Math.min(14,Math.max(1,parseInt(el.value)||4)); dsave(); break;
  /* 1RM-Rechner: reiner UI-Zustand (nicht in S), daher kein save()/dsave() -
     nur das Ergebnis-Div wird direkt aktualisiert, damit der Eingabe-Fokus
     beim Tippen erhalten bleibt. */
  case 'rmw': ui.rm.w=el.value; updateRmOut(); break;
  case 'rmr': ui.rm.r=el.value; updateRmOut(); break;
 }}
/* ---------- Init ---------- */
function init(){
 applyTheme();
 document.addEventListener('click',handleClick);
 /* input/change-Dedupe: 'input' feuert bei jedem Tastendruck, 'change' beim
    Verlassen des Feldes (blur) - für Text-/Zahlenfelder oft mit demselben
    Endwert. Damit dieselbe Eingabe nicht zweimal verarbeitet wird, merken
    wir uns pro Feld+data-change den zuletzt verarbeiteten Wert. Trotzdem
    wird bei 'change' IMMER ein sofortiges, ungedebountes save() ausgelöst,
    damit beim Verlassen des Feldes garantiert nichts verloren geht. */
 const RM_KEYS=['rmw','rmr'];
 document.addEventListener('input',e=>{
  const t=e.target;if(!t||!t.dataset||!t.dataset.change)return;
  const key='_lv_'+t.dataset.change;
  if(t[key]===t.value)return;
  t[key]=t.value;
  onDataChange(e);
 });
 document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='impfile'){const file=e.target.files&&e.target.files[0];if(!file)return;
   const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);S=migrate(obj);save();closeModal();render();toast('Backup importiert ✅')}catch(err){toast('Ungültige Datei')}};rd.readAsText(file);return}
  const t=e.target;if(!t||!t.dataset||!t.dataset.change)return;
  const key='_lv_'+t.dataset.change,already=t[key]===t.value;
  t[key]=t.value;
  if(!already)onDataChange(e);
  if(!RM_KEYS.includes(t.dataset.change))save();
  if(t.dataset.change==='hval'){const x=S.habits.list.find(h=>h.id===t.dataset.id);if(x)hupd(x.id)}
 });
 $('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
 /* Robustes Speichern: 'change'/blur löst bereits ein sofortiges save()
    aus (siehe change-Listener oben). Zusätzlich wird beim Wechsel des
    Browser-Tabs bzw. beim Verlassen der Seite ein ungedebountes save()
    erzwungen - so gehen auch Eingaben verloren, die noch im 300ms-
    Debounce-Fenster hängen, wenn schnell weggewechselt wird. */
 document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
 window.addEventListener('pagehide',save);
 window.addEventListener('blur',save);
 tickClock();
 render();
}
init();
</script>
