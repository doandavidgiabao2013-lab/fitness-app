<title>Momentum</title>
<style>
:root{--bg:#0e0f13;--card:#1a1c23;--tx:#f2f3f7;--mu:#a3a8b6;--ac:#3ddc84;--bd:#2c2f3a;--rd:#ff5d5d;--bl:#4c9dff;--yl:#ffc94d;--nav:58px}
:root[data-theme=light]{--bg:#f1f2f6;--card:#fff;--tx:#14151a;--mu:#555b6b;--bd:#d6d9e2;--ac:#12a150}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#main{height:100dvh;overflow-y:auto;overflow-x:hidden;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(var(--nav) + env(safe-area-inset-bottom) + 110px) calc(14px + env(safe-area-inset-left))}
h2,h3{margin:.2em 0 .5em}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.t{font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.08em;margin-bottom:8px}
.tm{font-size:11px;font-weight:600;color:var(--mu);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.mu{color:var(--mu)}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.w{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
.b{background:var(--ac);color:#04140a;border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;min-height:44px;min-width:44px;cursor:pointer}
.b2{background:var(--bd);color:var(--tx)}.bd{background:var(--rd);color:#fff}.sm{padding:6px 10px;min-height:36px;min-width:36px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--bl);outline-offset:1px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:16px inherit;min-height:44px}
label{display:block;min-width:0}label>small{display:block;color:var(--mu);font-size:12px;margin:8px 0 3px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs .b{flex:1;white-space:nowrap}
.tabs .b:not(.on){background:var(--card);color:var(--mu);border:1px solid var(--bd)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}
.acc{color:var(--ac)}.val{font-size:22px;font-weight:800;min-width:70px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);height:calc(var(--nav) + env(safe-area-inset-bottom));padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
nav button span{font-size:20px}nav button.on{color:var(--ac);font-weight:700}
#tbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:var(--card);border-top:2px solid var(--ac);padding:8px calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));display:none;z-index:6}
#tbar.show{display:block}#tbar.flash{animation:fl .5s 6}@keyframes fl{50%{background:var(--ac)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}#modal.show{display:flex}
.sheet{width:100%;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%}#toast.show{opacity:1}
.set{display:grid;grid-template-columns:22px 1fr 1fr auto auto;gap:6px;align-items:end;margin:6px 0}.set.dn input{border-color:var(--ac)}.set.sk{opacity:.45}
.day-b{flex:1;padding:10px 0}.day-b:not(.on){background:var(--bd);color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;font-size:12px;color:var(--mu)}
.cd{aspect-ratio:1;border-radius:10px;border:2px solid var(--bd);background:none;color:var(--tx);font-weight:600;padding:0;min-width:0}
.cd.g{background:var(--ac);color:#04140a;border-color:var(--ac)}.cd.b{background:var(--bl);color:#fff;border-color:var(--bl)}.cd.y{background:var(--yl);color:#221900;border-color:var(--yl)}.cd.r{background:var(--rd);color:#fff;border-color:var(--rd)}.cd.today{outline:2px solid var(--tx)}
.fr{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.fr:last-child{border-bottom:0;padding-bottom:0}.fr:first-child{padding-top:0}.fr span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.emo button{font-size:22px;background:var(--bg);border:2px solid transparent;border-radius:10px;min-height:40px;padding:0}.emo button.on{border-color:var(--ac)}
</style>
</head>
<body>
<div id="main" role="main"></div>
<div id="tbar" role="timer" aria-live="off"></div>
<nav id="nav" aria-label="Hauptnavigation"></nav>
<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const KEY='momentum_v2',$=id=>document.getElementById(id),K=2.20462;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dk=d=>{d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),wdi=d=>(d.getDay()+6)%7;
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'],DAYF=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MEALS=['Breakfast','Lunch','Dinner','Snack'],CATS=['Morning','Afternoon','Evening','Meal','Anytime','Weekly'];
const STEP={l:.25,ml:250,steps:1000,min:5,pages:5,km:1},UL={l:'l',ml:'ml',steps:'Schritte',min:'min',pages:'Seiten',km:'km'};
const EMO=['☀️','💧','🏃','🧘','📖','🍎','🥗','💊','😴','🚶','🧠','✍️','🦷','🚿','🛏️','🎯','💪','🚴','🏊','🥤','🍳','🌙','☕','🧹'];
function def(){return{version:2,settings:{unit:'kg',theme:'dark',rest:90,bw:75,goal:4},routines:[],workoutLogs:[],habits:{list:[],log:{}},food:{},water:{},sleep:{},calendar:{},activeWorkout:null,timer:null}}
const isO=x=>x&&typeof x==='object'&&!Array.isArray(x),arrO=a=>Array.isArray(a)?a.filter(isO):[],num=(v,d)=>{v=parseFloat(v);return isFinite(v)?v:d},oneOf=(v,l,d)=>l.includes(v)?v:d,DRE=/^\d{4}-\d{2}-\d{2}$/;
const bx=e=>({name:String(e.name||'Übung'),unit:oneOf(e.unit,['kg','lbs','reps','none'],'kg'),bw:oneOf(e.bw,['none','bw','plus','minus'],'none')});
const wr=x=>({w:Math.max(0,num(x.w,0)),r:Math.max(0,parseInt(x.r)||0)});
function migrate(o){const d=def();if(!isO(o))return d;const s={...d},st=isO(o.settings)?o.settings:{};
 s.settings={unit:oneOf(st.unit,['kg','lbs'],'kg'),theme:oneOf(st.theme,['dark','light'],'dark'),rest:Math.min(600,Math.max(5,parseInt(st.rest)||90)),bw:Math.max(0,num(st.bw,75)),goal:Math.min(14,Math.max(1,parseInt(st.goal)||4))};
 s.routines=arrO(o.routines).map(r=>({id:String(r.id||uid()),name:String(r.name||'Routine'),days:(Array.isArray(r.days)?r.days:[]).filter(n=>Number.isInteger(n)&&n>=0&&n<=6),exercises:arrO(r.exercises).map(e=>({...bx(e),id:String(e.id||uid()),w:Math.max(0,num(e.w,0)),sets:Math.max(1,parseInt(e.sets)||1),reps:Math.max(0,parseInt(e.reps)||0)}))}));
 s.workoutLogs=arrO(o.workoutLogs).map(l=>({id:String(l.id||uid()),date:DRE.test(l.date)?l.date:dk(),name:String(l.name||'Workout'),start:num(l.start,0),end:num(l.end,0),exs:arrO(l.exs).map(e=>({...bx(e),sets:arrO(e.sets).map(wr)}))}));
 const h=isO(o.habits)?o.habits:{list:o.habits};
 s.habits={list:arrO(h.list).map(x=>({id:String(x.id||uid()),name:String(x.name||'Habit'),emoji:String(x.emoji||'✅'),cat:oneOf(x.cat,CATS,'Anytime'),time:/^\d{2}:\d{2}$/.test(x.time)?x.time:'',target:Math.max(0,num(x.target,0)),unit:oneOf(x.unit,['check','none',...Object.keys(STEP)],'check')})),log:{}};
 if(isO(h.log))Object.keys(h.log).forEach(k=>{if(isO(h.log[k]))s.habits.log[k]=h.log[k]});
 s.food={};if(isO(o.food))Object.keys(o.food).forEach(k=>{const v=o.food[k];if(!isO(v))return;s.food[k]={};MEALS.forEach(m=>{s.food[k][m]=arrO(v[m]).map(y=>({id:String(y.id||uid()),name:String(y.name||''),g:num(y.g,0),done:true}))})});
 ['water','sleep'].forEach(k=>{s[k]={};if(isO(o[k]))Object.keys(o[k]).forEach(kk=>{const n=num(o[k][kk],NaN);if(isFinite(n))s[k][kk]=Math.max(0,n)})});
 s.calendar={};if(isO(o.calendar))Object.keys(o.calendar).forEach(k=>{if(isO(o.calendar[k]))s.calendar[k]={note:String(o.calendar[k].note||'')}});
 const a=o.activeWorkout;s.activeWorkout=isO(a)&&Array.isArray(a.exs)?{date:DRE.test(a.date)?a.date:dk(),start:num(a.start,Date.now()),rid:String(a.rid||'free'),name:String(a.name||'Workout'),exs:arrO(a.exs).map(e=>({...bx(e),sets:arrO(e.sets).map(x=>({...wr(x),done:!!x.done,skip:!!x.skip}))}))}:null;
 const t=o.timer;s.timer=isO(t)&&isFinite(t.end)&&(t.paused!=null||Date.now()-t.end<=10000)?{orig:Math.max(1000,num(t.orig,90000)),dur:Math.max(1000,num(t.dur,90000)),end:t.end,paused:t.paused!=null?Math.max(0,num(t.paused,0)):null,fired:!!t.fired}:null;
 s.version=2;return s}
let S;try{S=migrate(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Speichern fehlgeschlagen')}};
let tId=0;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tId);tId=setTimeout(()=>t.classList.remove('show'),2400)}
const ui={tab:'home',sub:'today',hs:'habits',cm:0,days:[],emo:'☀️',fd:dk(),hd:dk()};
const gu=()=>S.settings.unit==='lbs'?'lbs':'kg',cv=(kg,u)=>Math.round((u==='lbs'?kg*K:kg)*10)/10;
const fk=(v,u)=>{v=parseFloat(String(v).replace(',','.'));if(!isFinite(v)||v<0)v=0;return u==='lbs'?v/K:v};
const fmt=n=>+(+n).toFixed(2);
function load(e,w){const b=+S.settings.bw||0;w=+w||0;return e.bw==='bw'?b:e.bw==='plus'?b+w:e.bw==='minus'?Math.max(0,b-w):(e.unit==='kg'||e.unit==='lbs')?w:0}
const volOf=l=>(l.exs||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,s)=>b+load(e,s.w)*(+s.r||0),0),0);
function weekStart(){const d=new Date();d.setDate(d.getDate()-wdi(d));return dk(d)}
const hv=(k,id)=>(S.habits.log[k]||{})[id];
const hdone=(k)=>Object.values(S.habits.log[k]||{}).some(v=>v);
const fmtn=n=>(+n||0).toLocaleString('de-DE',{maximumFractionDigits:2});
function hinfo(x,v){const g=+x.target||0,p=g>0?Math.min(100,(+v||0)/g*100):0,ok=g>0&&(+v||0)>=g;return{p,ok,txt:`${ok?'✅ ':''}${fmtn(v)} / ${fmtn(g)} ${UL[x.unit]||''} (${Math.round(p)} %)`}}
function hupd(id){const x=S.habits.list.find(y=>y.id===id),i=$('hb'+id),l=$('hl'+id);if(!x||!i||!l)return;const n=hinfo(x,hv(ui.hd,id));i.style.width=n.p+'%';i.style.background=n.ok?'var(--ac)':'var(--yl)';l.textContent=n.txt}
function streak(ok,skip){const d=new Date();let n=0;for(let i=0;i<400;i++){if(ok(dk(d)))n++;else if(i>0&&!(skip&&skip(d)))break;d.setDate(d.getDate()-1)}return n}
const restDay=d=>S.routines.length>0&&!S.routines.some(r=>r.days.includes(wdi(d)));
function st(k){const d=new Date(k+'T12:00:00'),wd=wdi(d),pl=S.routines.some(r=>r.days.includes(wd));
 if(S.workoutLogs.some(l=>l.date===k))return'g';
 if(hdone(k)||(S.activeWorkout&&S.activeWorkout.date===k))return'y';
 if(k<dk()&&pl)return'r';if(S.routines.length&&!pl)return'b';return'n'}
/* ---------- Views ---------- */
function vHome(){const t=dk(),wd=wdi(new Date()),rs=S.routines.filter(r=>r.days.includes(wd)),done=S.workoutLogs.some(l=>l.date===t);
 let today;
 if(S.activeWorkout)today=`<b>Workout läuft: ${esc(S.activeWorkout.name)}</b><div class="row w" style="margin-top:8px"><button class="b" data-action="sub" data-id="log" data-tab="workouts">Fortsetzen</button></div>`;
 else if(rs.length)today=`<b>${DAYS[wd]} Today: ${esc(rs.map(r=>r.name).join(' + '))} Workout ${done?'✅':''}</b><div class="row w" style="margin-top:8px">${rs.map(r=>`<button class="b" data-action="start" data-id="${r.id}">▶ ${esc(r.name)} starten</button>`).join('')}</div>`;
 else today=`<b>Kein Workout gestartet</b><p class="mu" style="margin:4px 0 10px">Wähle eine Routine oder leg los</p><button class="b" data-action="nav" data-id="workouts">Zum Workout-Tab</button>`;
 const ws=weekStart(),wc=S.workoutLogs.filter(l=>l.date>=ws).length,goal=Math.max(1,+S.settings.goal||4),w=S.water[t]||0,sl=S.sleep[t]||0;
 const ws1=streak(k=>S.workoutLogs.some(l=>l.date===k),restDay),hs=streak(hdone);
 return`<div class="row sp"><div><h2 style="margin:0;font-size:26px">Momentum<span class="acc">.</span></h2><div class="mu">Guten Tag 👋</div></div><button class="b b2" data-action="gear" aria-label="Einstellungen">⚙️</button></div>
 <div style="margin:14px 0 18px"><div class="big" id="clk"></div><div class="mu" id="dt"></div></div>
 <div class="c"><div class="t">HEUTE</div>${today}</div>
 <div class="g2"><div class="c"><div class="t">🔥 WORKOUT-STREAK</div><div class="val" style="text-align:left">${ws1} Tage</div></div><div class="c"><div class="t">✅ HABIT-STREAK</div><div class="val" style="text-align:left">${hs} Tage</div></div></div>
 <div class="c"><div class="row sp"><div class="t">WOCHENZIEL</div><b>${wc}/${goal}</b></div><div class="bar"><i style="width:${Math.min(100,wc/goal*100)}%"></i></div></div>
 <div class="c"><div class="t">💧 WASSER</div><div class="row sp"><button class="b b2" data-action="water" data-id="-0.25" aria-label="0,25 Liter weniger">−</button><div class="val">${fmt(w)} l</div><button class="b" data-action="water" data-id="0.25" aria-label="0,25 Liter mehr">+</button></div></div>
 <div class="c"><div class="t">😴 SCHLAF</div><div class="row sp"><button class="b b2" data-action="sleep" data-id="-1" aria-label="Eine Stunde weniger">−</button><div class="val">${sl} Std</div><button class="b" data-action="sleep" data-id="1" aria-label="Eine Stunde mehr">+</button></div></div>`}
function exLine(e){const u=e.unit,wl=e.bw==='bw'?'BW':e.bw==='plus'?`BW + ${cv(e.w,u)} ${u==='lbs'?'lbs':'kg'}`:e.bw==='minus'?`BW - ${cv(e.w,u)} ${u==='lbs'?'lbs':'kg'}`:(u==='kg'||u==='lbs')?`${cv(e.w,u)} ${u}`:u==='reps'?'Reps':'';return`${e.sets}×${e.reps} ${wl}`}
function vWork(){const tabs=[['today','Today Workout'],['log','Active Log'],['routines','Routines'],['history','History']];
 let h=`<h2>Workouts</h2><div class="tabs">${tabs.map(t=>`<button class="b sm ${ui.sub===t[0]?'on':''}" data-action="sub" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>`;
 if(ui.sub==='today'){const rs=S.routines.filter(r=>r.days.includes(wdi(new Date())));
  h+=rs.length?rs.map(r=>`<div class="c"><b>${esc(r.name)}</b>${r.exercises.map(e=>`<div class="mu">${esc(e.name)} – ${exLine(e)}</div>`).join('')||'<div class="mu">Noch keine Übungen</div>'}<button class="b" style="margin-top:8px" data-action="start" data-id="${r.id}">▶ Starten</button></div>`).join(''):`<div class="c">Heute ist keine Routine geplant.<div class="row w" style="margin-top:8px"><button class="b" data-action="start" data-id="free">Freies Workout</button><button class="b b2" data-action="sub" data-id="routines">Routinen</button></div></div>`}
 if(ui.sub==='log'){const a=S.activeWorkout;
  if(!a)h+=`<div class="c">Kein aktives Workout.<div style="margin-top:8px"><button class="b" data-action="start" data-id="free">Freies Workout starten</button></div></div>`;
  else h+=`<div class="c"><b>${esc(a.name)}</b> <span class="mu">${a.date}</span></div>`+a.exs.map((e,i)=>{const u=e.unit,hw=(u==='kg'||u==='lbs')||e.bw==='plus'||e.bw==='minus',wl=e.bw==='plus'?`Zusatz (${u==='lbs'?'lbs':'kg'})`:e.bw==='minus'?`Abzug (${u==='lbs'?'lbs':'kg'})`:`Gewicht (${u})`;

 case'tpause':{const x=S.timer;if(!x)break;if(x.paused!=null){x.end=Date.now()+x.paused;x.paused=null}else x.paused=tRem();save();bar();break}
 case'tadd':{const x=S.timer;if(!x)break;const ms=(+d.id)*1000;x.dur=Math.max(1000,x.dur+ms);if(x.paused!=null)x.paused=Math.max(0,x.paused+ms);else x.end+=ms;if(tRem()>0)x.fired=false;save();bar();break}
 case'treset':{const x=S.timer;if(!x)break;x.dur=x.orig;x.end=Date.now()+x.orig;x.paused=null;x.fired=false;save();bar();break}
 case'tskip':S.timer=null;save();bar();break;
 case'habmodal':habModal();break;
 case'edith':habModal(d.id);break;
 case'emo':ui.emo=d.id;$('emp').textContent=d.id;document.querySelectorAll('.emo button').forEach(b=>b.classList.toggle('on',b.dataset.id===d.id));break;
 case'savh':{const n=$('hn').value.trim();if(!n){toast('Bitte einen Namen eingeben');break}const o={name:n,emoji:ui.emo,cat:$('hc').value,time:$('ht').value||'',unit:$('hu').value,target:Math.max(0,parseFloat(String($('hg').value).replace(',','.'))||0)},x=d.id&&S.habits.list.find(y=>y.id===d.id);if(x)Object.assign(x,o);else S.habits.list.push({id:uid(),...o});save();closeM();render();break}
 case'delh':if(confirm('Habit löschen?')){S.habits.list=S.habits.list.filter(x=>x.id!==d.id);save();render()}break;
 case'htog':{const l=S.habits.log[ui.hd]||(S.habits.log[ui.hd]={});l[d.id]=!l[d.id];save();render();break}
 case'hstep':{const h=S.habits.list.find(x=>x.id===d.id);if(!h)break;const l=S.habits.log[ui.hd]||(S.habits.log[ui.hd]={});l[d.id]=Math.max(0,Math.round(((+l[d.id]||0)+(+d.dir)*(STEP[h.unit]||1))*100)/100);save();render();break}
 case'fadd':{const i=+d.id,n=$('fn'+i).value.trim();if(!n){toast('Bitte Lebensmittel eingeben');break}const f=S.food[ui.fd]||(S.food[ui.fd]={});(f[MEALS[i]]||(f[MEALS[i]]=[])).push({id:uid(),name:n,g:parseFloat(String($('fg'+i).value).replace(',','.'))||0,done:true});save();render();break}
 case'fdone':{const x=((S.food[ui.fd]||{})[d.meal]||[]).find(y=>y.id===d.id);if(x){x.done=true;save();render()}break}
 case'fdel':{const f=S.food[ui.fd]||{};f[d.meal]=(f[d.meal]||[]).filter(y=>y.id!==d.id);save();render();break}
 case'cm':ui.cm+=+d.id;render();break;
 case'day':dayModal(d.date);break;
 case'theme':S.settings.theme=S.settings.theme==='dark'?'light':'dark';save();render();setModal();break;
 case'unit':{const to=gu()==='kg'?'lbs':'kg';S.settings.unit=to;const cvx=e=>{if(e.unit==='kg'||e.unit==='lbs')e.unit=to};S.routines.forEach(r=>r.exercises.forEach(cvx));if(A)A.exs.forEach(cvx);save();render();setModal();break}
 case'export':{try{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='momentum-backup-'+t+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),5000)}catch(e){toast('Export fehlgeschlagen')}break}
 case'reset':openM(`<h3>Alle Daten löschen?</h3><p class="mu">Dies entfernt alle Routinen, Workouts, Habits und Einträge unwiderruflich. Erstelle vorher ein Backup.</p><div class="row"><button class="b bd" data-action="reset2">Ja, alles löschen</button><button class="b b2" data-action="close">Abbrechen</button></div>`);break;
 case'reset2':try{localStorage.removeItem(KEY)}catch(e){}S=def();save();closeM();ui.tab='home';render();toast('Daten zurückgesetzt');break}}
function chg(a,d,el){const A=S.activeWorkout,v=el.value;switch(a){
 case'sw':{const e=A&&A.exs[d.ex];if(e&&e.sets[d.id]){e.sets[d.id].w=fk(v,e.unit);save()}break}
 case'sr':{const e=A&&A.exs[d.ex];if(e&&e.sets[d.id]){e.sets[d.id].r=Math.max(0,parseInt(v)||0);save()}break}
 case'fdate':if(v){ui.fd=v;render()}break;
 case'note':(S.calendar[d.date]||(S.calendar[d.date]={})).note=v;save();break;
 case'hval':{const l=S.habits.log[ui.hd]||(S.habits.log[ui.hd]={});l[d.id]=Math.max(0,parseFloat(String(v).replace(',','.'))||0);save();hupd(d.id);break}
 case'hdate':if(DRE.test(v)){ui.hd=v;render()}break;
 case'sbw':S.settings.bw=fk(v,gu());save();break;
 case'srest':S.settings.rest=Math.min(600,Math.max(5,parseInt(v)||90));save();break;
 case'sgoal':S.settings.goal=Math.min(14,Math.max(1,parseInt(v)||4));save();render();break;
 case'imp':{const f=el.files&&el.files[0];if(!f)break;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||Array.isArray(o)||!('routines' in o||'workoutLogs' in o||'habits' in o||'settings' in o))throw 0;S=migrate(o);save();closeM();render();toast('Backup importiert ✅')}catch(e){toast('Ungültige Backup-Datei')}};r.onerror=()=>toast('Datei nicht lesbar');r.readAsText(f);break}}}
document.addEventListener('click',e=>{if(e.target.id==='modal'){closeM();return}
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(x){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
 const el=e.target.closest('[data-action]');if(el){try{act(el.dataset.action,el.dataset,el)}catch(x){console.error(x);toast('Fehler aufgetreten')}}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el){try{chg(el.dataset.change,el.dataset,el)}catch(x){console.error(x);toast('Fehler aufgetreten')}}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-change]');if(el&&['hval','sw','sr','note'].includes(el.dataset.change)){try{chg(el.dataset.change,el.dataset,el)}catch(x){console.error(x)}}});
window.addEventListener('pagehide',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('show'))closeM()});
render();
</script>
</body>
</html>
