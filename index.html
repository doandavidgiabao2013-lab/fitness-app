 toast(hadHistory?'Workout gestartet 💪 · Sätze aus letztem Training vorausgefüllt':'Workout gestartet 💪')}
function finishWorkout(){const a=S.activeWorkout;if(!a)return;
 if(!a.exs.some(e=>e.sets.some(s=>s.done))){toast('Noch keine Sätze abgeschlossen.');return}
 S.workoutLogs.push({id:uid(),date:a.date,name:a.name,start:a.start,end:Date.now(),exs:a.exs});
 S.activeWorkout=null;S.timer=null;save();hideTimerBar();ui.sub='history';render();toast('Workout gespeichert ✅')}
function handleClick(e){
 const emo=e.target.closest('[data-pick-emoji]');
 if(emo){$('habEmoji').value=emo.getAttribute('data-pick-emoji');emo.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));emo.classList.add('on');return}
 const b=e.target.closest('[data-action]');if(!b)return;
 const ds=b.dataset,id=ds.id,today=dk();
 switch(ds.action){
  case 'nav': ui.tab=id; render(); break;
  case 'sub': ui.sub=id; if(ds.tab)ui.tab=ds.tab; render(); break;
  case 'hsub': ui.hs=id; render(); break;
  case 'gear': openModal(mSettings()); break;
  case 'close': closeModal(); break;
  case 'start': startWorkout(id); break;
  case 'finish': finishWorkout(); break;
  case 'cancelw': if(confirm('Workout wirklich abbrechen?')){S.activeWorkout=null;S.timer=null;save();hideTimerBar();ui.sub='today';render()} break;
  case 'water':{S.water[today]=Math.max(0,fmt((S.water[today]||0)+parseFloat(id)));save();const el=$('valWater');if(el)el.textContent=fmt(S.water[today])+' l';else render();break}
  case 'sleep':{S.sleep[today]=Math.max(0,(S.sleep[today]||0)+parseInt(id));save();const el=$('valSleep');if(el)el.textContent=S.sleep[today]+' Std';else render();break}
  case 'steps':{S.steps[today]=Math.max(0,(S.steps[today]||0)+parseInt(id));save();const el=$('valSteps');if(el)el.textContent=fmtn(S.steps[today]);else render();break}
  case 'dtog':{const i=+id;ui.days=ui.days.includes(i)?ui.days.filter(x=>x!==i):[...ui.days,i];ui.rest=ui.rest.filter(x=>x!==i);render();break}
  case 'rtog':{const i=+id;if(ui.days.includes(i))break;ui.rest=ui.rest.includes(i)?ui.rest.filter(x=>x!==i):[...ui.rest,i];render();break}
  case 'addr':{const nm=(ui.rname||'').trim(),restOnly=ui.days.length===0&&ui.rest.length>0;
   if(!ui.days.length&&!ui.rest.length){toast('Bitte mindestens einen Tag wählen');break}
   if(!nm&&!restOnly){toast('Bitte Namen eingeben');break}
   S.routines.push({id:uid(),name:nm||'Ruhetag',days:[...ui.days],rest:[...ui.rest],exercises:[]});
   ui.days=[];ui.rest=[];ui.rname='';save();render();toast('Routine angelegt');break}
  case 'delr': if(confirm('Routine wirklich löschen?')){S.routines=S.routines.filter(r=>r.id!==id);save();render()} break;
  case 'delex':{const r=S.routines.find(x=>x.id===id);if(r){r.exercises=r.exercises.filter(e=>e.id!==ds.ex);save();render()}break}
  case 'exup':{const r=S.routines.find(x=>x.id===id);if(!r)break;const i=r.exercises.findIndex(e=>e.id===ds.ex);if(i>0){const a=r.exercises;[a[i-1],a[i]]=[a[i],a[i-1]];save();render()}break}
  case 'exdown':{const r=S.routines.find(x=>x.id===id);if(!r)break;const i=r.exercises.findIndex(e=>e.id===ds.ex);if(i>-1&&i<r.exercises.length-1){const a=r.exercises;[a[i],a[i+1]]=[a[i+1],a[i]];save();render()}break}
  case 'editex': openModal(mExEdit(id,ds.ex)); break;
  case 'exsave':{const rid=$('exERid').value,exid=$('exEId').value,r=S.routines.find(x=>x.id===rid);if(!r)break;
   const e=r.exercises.find(x=>x.id===exid);if(!e)break;
   const name=($('exEName').value||'').trim();if(!name){toast('Bitte Namen eingeben');break}
   e.name=name;e.unit=oneOf($('exEUnit').value,['kg','lbs','reps','none'],e.unit);e.bw=oneOf($('exEBw').value,['none','bw','plus','minus'],e.bw);
   e.sets=Math.max(1,parseInt($('exESets').value)||1);e.reps=Math.max(0,parseInt($('exEReps').value)||0);
   const wv=fk($('exEW').value,gu());e.w=wv==null?0:wv;
   save();closeModal();render();toast('Übung aktualisiert');break}
  case 'exmodal': openModal(mExercise(id)); break;
  case 'tplmodal': openModal(mTemplates(id)); break;
  case 'tpladd':{const tpl=TEMPLATES[id];if(!tpl||!tpl.length)break;const target=ds.target;
   if(target==='active'){const a=S.activeWorkout;if(!a)break;
    tpl.forEach(t=>{const unit=oneOf(t.unit,['kg','lbs','reps','none'],'kg'),bwm=oneOf(t.bw,['none','bw','plus','minus'],'none');
     a.exs.push({name:t.name,unit,bw:bwm,sets:suggestSets({name:t.name,unit,bw:bwm,sets:t.sets,reps:t.reps,w:t.w})})});
   }else{const r=S.routines.find(x=>x.id===target);if(!r)break;
    tpl.forEach(t=>{const unit=oneOf(t.unit,['kg','lbs','reps','none'],'kg'),bwm=oneOf(t.bw,['none','bw','plus','minus'],'none');
     r.exercises.push({id:uid(),name:t.name,unit,bw:bwm,w:Math.max(0,+t.w||0),sets:Math.max(1,parseInt(t.sets)||1),reps:Math.max(0,parseInt(t.reps)||0)})})}
   save();closeModal();render();toast('Vorlage hinzugefügt ✅');break}
  case 'exadd':{const target=$('exTarget').value,name=($('exName').value||'').trim();if(!name){toast('Bitte Namen eingeben');break}
   const unit=$('exUnit').value,bwm=$('exBw').value;
   if(target==='active'){const a=S.activeWorkout;if(!a)break;a.exs.push({name,unit,bw:bwm,sets:suggestSets({name,unit,bw:bwm,sets:1,reps:0,w:0})})}
   else{const r=S.routines.find(x=>x.id===target);if(!r)break;const sets=Math.max(1,parseInt($('exSets').value)||1),reps=Math.max(0,parseInt($('exReps').value)||0),wv=fk($('exW').value,gu()),w=wv==null?0:wv;r.exercises.push({id:uid(),name,unit,bw:bwm,w,sets,reps})}
   save();closeModal();render();toast('Übung hinzugefügt');break}
  case 'aset':{const a=S.activeWorkout,ex=a.exs[+ds.ex],last=ex.sets[ex.sets.length-1];ex.sets.push({w:last?last.w:0,r:last?last.r:0,rpe:null,note:'',done:false,skip:false});save();render();break}
  case 'axdel':{const a=S.activeWorkout;a.exs.splice(+ds.ex,1);save();render();break}
  case 'done':{const a=S.activeWorkout,ex=a.exs[+ds.ex],s=ex.sets[+ds.id];s.done=!s.done;if(s.done){s.skip=false;startTimer()}save();render();break}
  case 'skip':{const a=S.activeWorkout,ex=a.exs[+ds.ex],s=ex.sets[+ds.id];s.skip=!s.skip;if(s.skip)s.done=false;save();render();break}
  case 'habmodal': openModal(mHabit(null)); break;
  case 'edith': openModal(mHabit(id)); break;
  case 'delh': if(confirm('Habit wirklich löschen?')){S.habits.list=S.habits.list.filter(h=>h.id!==id);save();render()} break;
  case 'habsave':{const hid=$('habId').value,name=($('habName').value||'').trim();if(!name){toast('Bitte Namen eingeben');break}
   const data={name,emoji:$('habEmoji').value||'✅',cat:oneOf($('habCat').value,CATS,'Anytime'),time:$('habTime').value||'',unit:oneOf($('habUnit').value,['check',...Object.keys(STEP)],'check'),target:Math.max(0,num($('habTarget').value,0)),freq:oneOf($('habFreq').value,['daily','weekly'],'daily'),wtarget:Math.min(7,Math.max(1,parseInt($('habWTarget').value)||3))};
   if(hid){const h=S.habits.list.find(x=>x.id===hid);if(h)Object.assign(h,data)} else S.habits.list.push({id:uid(),...data});
   save();closeModal();render();toast('Gespeichert');break}
  case 'hstep':{const x=S.habits.list.find(h=>h.id===id);if(!x)break;const k=ui.hd,cur=hv(k,x.id)||0,q=STEP[x.unit]||1,dir=+ds.dir;
   S.habits.log[k]=S.habits.log[k]||{};S.habits.log[k][x.id]=Math.max(0,+(cur+q*dir).toFixed(2));save();render();break}
  case 'htog':{const k=ui.hd;S.habits.log[k]=S.habits.log[k]||{};S.habits.log[k][id]=!S.habits.log[k][id];save();render();break}
  case 'htoday':{const k=today;S.habits.log[k]=S.habits.log[k]||{};S.habits.log[k][id]=!S.habits.log[k][id];save();render();break}
  case 'quicktimer': startTimer(); toast('⏱ Pause-Timer gestartet'); break;
  case 'fadd':{const i=+id,m=MEALS[i],nEl=$('fn'+i),gEl=$('fg'+i),name=(nEl.value||'').trim(),gRaw=(gEl.value||'').trim();
   if(!name){toast('Bitte Namen eingeben');break}
   if(gRaw===''){toast('Bitte Gramm eingeben');break}
   const g=Math.max(0,num(gRaw,0));
   S.food[ui.fd]=S.food[ui.fd]||{};S.food[ui.fd][m]=S.food[ui.fd][m]||[];S.food[ui.fd][m].push({id:uid(),name,g,done:true});save();render();break}
  case 'fdone':{const arr=(S.food[ui.fd]&&S.food[ui.fd][ds.meal])||[],x=arr.find(y=>y.id===id);if(x)x.done=true;save();render();break}
  case 'fdel':{if(S.food[ui.fd]&&S.food[ui.fd][ds.meal])S.food[ui.fd][ds.meal]=S.food[ui.fd][ds.meal].filter(y=>y.id!==id);save();render();break}
  case 'day': openModal(mDay(ds.date)); break;
  case 'cm': ui.cm+=parseInt(id); render(); break;
  case 'tpause': pauseTimer(); break;
  case 'tresume': resumeTimer(); break;
  case 'tskip': S.timer=null; save(); hideTimerBar(); break;
  case 'tplus': if(S.timer){S.timer.dur+=15000;if(S.timer.end!=null)S.timer.end+=15000;else S.timer.paused=(S.timer.paused||0)+15000;save();renderTimerBar()} break;
  case 'export':{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='momentum-backup-'+dk()+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup exportiert');break}
  case 'import':{const f=$('impfile'); if(f)f.click(); break}
  case 'dellog': if(confirm('Diesen Workout-Eintrag wirklich löschen?')){S.workoutLogs=S.workoutLogs.filter(l=>l.id!==id);save();render();toast('Eintrag gelöscht')} break;
 }
}
function onDataChange(e){const el=e.target,dc=el.dataset&&el.dataset.change;if(!dc)return;const u=gu();
 switch(dc){
  case 'sw':{const a=S.activeWorkout;if(!a)break;const ex=a.exs[+el.dataset.ex],s=ex.sets[+el.dataset.id],v=fk(el.value,u);if(v!=null)s.w=v;dsave();break}
  case 'sr':{const a=S.activeWorkout;if(!a)break;const exi=+el.dataset.ex,ex=a.exs[exi],s=ex.sets[+el.dataset.id];if(el.value!=='')s.r=Math.max(0,parseInt(el.value)||0);dsave();
   const badge=$('reph'+exi);if(badge){const rh=repProgressionHint(ex);if(rh){badge.textContent=rh;badge.style.display=''}else{badge.style.display='none'}}
   break}
  case 'srpe':{const a=S.activeWorkout;if(!a)break;const ex=a.exs[+el.dataset.ex],s=ex.sets[+el.dataset.id],raw=String(el.value).trim();if(raw===''){s.rpe=null}else{const v=parseFloat(raw.replace(',','.'));if(isFinite(v))s.rpe=Math.min(10,Math.max(0,Math.round(v*2)/2))}dsave();break}
  case 'snote':{const a=S.activeWorkout;if(!a)break;const ex=a.exs[+el.dataset.ex],s=ex.sets[+el.dataset.id];s.note=el.value.slice(0,140);dsave();break}
  case 'rname': ui.rname=el.value; break;
  case 'hdate':{const v=el.value||dk();if(v>dk()){ui.hd=dk();toast('Zukünftiges Datum – auf heute gesetzt')}else{ui.hd=v}render();break}
  case 'fdate': ui.fd=el.value||dk(); render(); break;
  case 'hval':{const x=S.habits.list.find(h=>h.id===el.dataset.id);if(!x)break;const k=ui.hd;S.habits.log[k]=S.habits.log[k]||{};if(el.value!=='')S.habits.log[k][x.id]=Math.max(0,num(el.value,0));dsave();hupd(x.id);break}
  case 'daynote':{const k=el.dataset.date;S.calendar[k]=S.calendar[k]||{note:''};S.calendar[k].note=el.value;dsave();break}
  case 'unit': S.settings.unit=el.value; save(); render(); break;
  case 'theme': S.settings.theme=el.value; applyTheme(); save(); break;
  case 'rest': if(el.value!=='')S.settings.rest=Math.min(600,Math.max(5,parseInt(el.value)||90)); dsave(); break;
  case 'bw':{const v=fk(el.value,u);if(v!=null){S.bodyweight[dk()]=v}dsave();break}
  case 'goal': if(el.value!=='')S.settings.goal=Math.min(14,Math.max(1,parseInt(el.value)||4)); dsave(); break;
  case 'rmw': ui.rm.w=el.value; updateRmOut(); break;
  case 'rmr': ui.rm.r=el.value; updateRmOut(); break;
 }}
function init(){
 applyTheme();
 let tsx=0,tsy=0,tmoved=false,lastTapTs=0;
 document.addEventListener('touchstart',e=>{
  const t=e.touches[0];if(!t)return;tsx=t.clientX;tsy=t.clientY;tmoved=false;
 },{passive:true});
 document.addEventListener('touchmove',e=>{
  const t=e.touches[0];if(!t)return;
  if(Math.abs(t.clientX-tsx)>10||Math.abs(t.clientY-tsy)>10)tmoved=true;
 },{passive:true});
 document.addEventListener('touchend',e=>{
  if(tmoved)return;
  const ct=e.changedTouches&&e.changedTouches[0];if(!ct)return;
  const el=document.elementFromPoint(ct.clientX,ct.clientY);if(!el)return;
  if(el.id==='modal'){lastTapTs=Date.now();e.preventDefault();closeModal();return}
  const hit=el.closest('[data-action],[data-pick-emoji]');if(!hit||hit.disabled)return;
  lastTapTs=Date.now();
  e.preventDefault();
  handleClick({target:hit});
 },{passive:false});
 document.addEventListener('click',e=>{
  if(Date.now()-lastTapTs<500)return;
  handleClick(e);
 });
 const RM_KEYS=['rmw','rmr','rname'];
 document.addEventListener('input',e=>{
  const t=e.target;
  if(t&&t.dataset&&t.dataset.nonneg&&typeof t.value==='string'&&t.value.indexOf('-')!==-1){
   const pos=t.selectionStart;t.value=t.value.replace(/-/g,'');
   try{if(pos!=null)t.setSelectionRange(Math.max(0,pos-1),Math.max(0,pos-1))}catch(err){}
  }
  if(!t||!t.dataset||!t.dataset.change)return;
  const key='_lv_'+t.dataset.change;
  if(t[key]===t.value)return;
  t[key]=t.value;
  onDataChange(e);
 });
 document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='impfile'){const file=e.target.files&&e.target.files[0];if(!file)return;
   const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);S=migrate(obj);save();closeModal();render();toast('Backup importiert ✅')}catch(err){toast('Ungültige Datei')}};rd.readAsText(file);return}
  const t=e.target;
  if(t&&t.dataset&&t.dataset.nonneg&&typeof t.value==='string'&&t.value.indexOf('-')!==-1)t.value=t.value.replace(/-/g,'');
  if(!t||!t.dataset||!t.dataset.change)return;
  const key='_lv_'+t.dataset.change,already=t[key]===t.value;
  t[key]=t.value;
  if(!already)onDataChange(e);
  if(!RM_KEYS.includes(t.dataset.change))save();
  if(t.dataset.change==='hval'){const x=S.habits.list.find(h=>h.id===t.dataset.id);if(x)hupd(x.id)}
 });
 $('modal').addEventListener('click',e=>{if(Date.now()-lastTapTs<500)return;if(e.target.id==='modal')closeModal()});
 document.addEventListener('focusin',e=>{
  const t=e.target;
  if(!t||!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  setTimeout(()=>{try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(err){}},300);
 });
 window.addEventListener('resize',()=>{const b=$('tbar');if(b&&b.classList.contains('show'))document.documentElement.style.setProperty('--tbarh',b.offsetHeight+'px')});
 const flushSave=()=>{dsave.flush();save()};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave()});
 window.addEventListener('pagehide',flushSave);
 window.addEventListener('blur',flushSave);
 render();
}
init();
</script>
