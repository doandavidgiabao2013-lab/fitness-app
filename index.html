<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="theme-color" content="#101114" id="themeColorMeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Momentum%22%2C%22short_name%22%3A%22Momentum%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23101114%22%2C%22theme_color%22%3A%22%23101114%22%7D">
<title>Momentum</title>
<style>

/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS & SYSTEM
═══════════════════════════════════════════════════════════ */
:root {
  --bg: #101114;
  --bg2: #16181D;
  --card: #1E2128;
  --card2: #252830;
  --card-elevated: #2B2F38;
  --ac: #00E5B0;
  --ac-hover: #00cca0;
  --ac-dim: rgba(0, 229, 176, 0.12);
  --ac-border: rgba(0, 229, 176, 0.25);
  --tx: #FFFFFF;
  --tx2: #A5A8AD;
  --tx3: #6B6E76;
  --bd: rgba(255, 255, 255, 0.08);
  --bd2: rgba(255, 255, 255, 0.05);
  --rd: #FF5D73;
  --rd-dim: rgba(255, 93, 115, 0.14);
  --bl: #4C9DFF;
  --bl-dim: rgba(76, 157, 255, 0.14);
  --yl: #FFD166;
  --yl-dim: rgba(255, 209, 102, 0.14);
  --pu: #A78BFA;
  --pu-dim: rgba(167, 139, 250, 0.14);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --nav-h: 64px;
  --tbar-h: 0px;
  --app-h: 100dvh;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 26px;
  --shadow: 0 8px 32px rgba(0,0,0,0.45);
}

:root[data-theme=light] {
  --bg: #F4F5F8;
  --bg2: #E9EBEF;
  --card: #FFFFFF;
  --card2: #F7F8FA;
  --card-elevated: #EDEFE4;
  --tx: #0E1013;
  --tx2: #5D6169;
  --tx3: #9598A0;
  --bd: rgba(0, 0, 0, 0.08);
  --bd2: rgba(0, 0, 0, 0.04);
  --ac: #00B88E;
  --ac-hover: #009e7a;
  --ac-dim: rgba(0, 184, 142, 0.12);
  --ac-border: rgba(0, 184, 142, 0.25);
  --shadow: 0 8px 30px rgba(0,0,0,0.08);
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
html { background: var(--bg); font-size: 16px; }
html, body {
  margin: 0; width: 100%;
  height: var(--app-h); min-height: var(--app-h);
  background: var(--bg); color: var(--tx);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden; position: fixed; inset: 0;
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { margin: 0; font-weight: 800; letter-spacing: -0.02em; }
p { margin: 0; }
button, input, select, textarea { font-family: inherit; }

#app { position: absolute; inset: 0; display: flex; flex-direction: column; }
#main {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding-top: calc(18px + var(--safe-t));
  padding-left: calc(16px + var(--safe-l));
  padding-right: calc(16px + var(--safe-r));
  padding-bottom: calc(var(--nav-h) + var(--safe-b) + var(--tbar-h) + 24px);
  background: var(--bg);
}

#subpage {
  position: absolute; inset: 0; background: var(--bg);
  overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  z-index: 25; display: none;
  padding: calc(18px + var(--safe-t)) calc(16px + var(--safe-r)) calc(32px + var(--safe-b)) calc(16px + var(--safe-l));
}
#subpage.show { display: block; }

/* ═══════════════════════════════════════════════════════════
   BOTTOM NAVIGATION — 5 PRIMARY DESTINATIONS
═══════════════════════════════════════════════════════════ */
#nav-wrap {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 20; pointer-events: none;
  padding-bottom: var(--safe-b);
}
#nav {
  pointer-events: all;
  margin: 0 14px 10px;
  background: rgba(22, 24, 29, 0.90);
  backdrop-filter: blur(24px) saturate(190%);
  -webkit-backdrop-filter: blur(24px) saturate(190%);
  border: 1px solid var(--bd);
  border-radius: 32px;
  height: 64px;
  display: flex;
  align-items: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.3);
}
:root[data-theme=light] #nav {
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 8px 30px rgba(0,0,0,0.1);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; background: none; border: none; color: var(--tx2);
  cursor: pointer; padding: 0; min-height: 64px; position: relative;
  transition: color 0.18s ease;
}
.nav-btn .nb-ic { font-size: 20px; line-height: 1; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
.nav-btn .nb-lb { font-size: 10px; font-weight: 700; letter-spacing: 0.02em; transition: color 0.18s ease; }
.nav-btn.on { color: var(--ac); }
.nav-btn.on .nb-ic { transform: scale(1.12); }
.nav-btn::before {
  content: ''; position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
  width: 40px; height: 36px; border-radius: 12px; background: var(--ac-dim);
  opacity: 0; transition: opacity 0.2s ease;
}
.nav-btn.on::before { opacity: 1; }

/* ═══════════════════════════════════════════════════════════
   REST TIMER BAR
═══════════════════════════════════════════════════════════ */
#tbar {
  position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b));
  background: var(--card); border-top: 2px solid var(--ac);
  padding: 10px calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
  display: none; z-index: 18; box-shadow: 0 -4px 20px rgba(0,229,176,0.12);
}
#tbar.show { display: block; }
#tbar.flash { animation: flash 0.5s 6; }
@keyframes flash { 50% { background: rgba(0,229,176,0.3); } }

/* ═══════════════════════════════════════════════════════════
   MODAL / SHEET
═══════════════════════════════════════════════════════════ */
#modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: none; align-items: flex-end; z-index: 40;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#modal.show { display: flex; }
.sheet {
  width: 100%; max-height: 92dvh; overflow-y: auto;
  background: var(--card); border-radius: 26px 26px 0 0;
  border-top: 1px solid var(--bd);
  padding: 10px calc(20px + var(--safe-r)) calc(36px + var(--safe-b)) calc(20px + var(--safe-l));
  box-shadow: var(--shadow);
}
.sheet-handle {
  width: 40px; height: 4px; background: var(--bd);
  border-radius: 2px; margin: 0 auto 18px;
}
.sheet h3 { font-size: 20px; font-weight: 800; margin-bottom: 16px; }

#toast {
  position: fixed; top: calc(16px + var(--safe-t)); left: 50%;
  transform: translateX(-50%) translateY(-10px);
  background: var(--tx); color: var(--bg);
  padding: 11px 20px; border-radius: 26px;
  font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none;
  transition: opacity 0.22s, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 60; max-width: 90%; white-space: nowrap; box-shadow: var(--shadow);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ═══════════════════════════════════════════════════════════
   SEGMENTED CONTROLS & PILLS
═══════════════════════════════════════════════════════════ */
.seg-control {
  display: flex; background: var(--bg2); border-radius: 12px;
  padding: 3px; border: 1px solid var(--bd2); gap: 2px;
}
.seg-btn {
  flex: 1; border: none; background: transparent; color: var(--tx2);
  font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 9px;
  cursor: pointer; transition: all 0.18s ease;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.seg-btn.on { background: var(--card); color: var(--tx); box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
:root[data-theme=light] .seg-btn.on { box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
.seg-btn.ac-on.on { background: var(--ac); color: #04140A; }

.pill-group { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.pill-group::-webkit-scrollbar { display: none; }
.pill-btn {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
  border: 1px solid var(--bd); background: var(--bg2); color: var(--tx2);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.pill-btn.on { background: var(--ac); border-color: var(--ac); color: #04140A; }

/* ═══════════════════════════════════════════════════════════
   CARDS & SURFACES
═══════════════════════════════════════════════════════════ */
.card {
  background: var(--card); border: 1px solid var(--bd);
  border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; position: relative;
}
.card-sm { padding: 12px 14px; }
.card-lg { padding: 20px; }
.card-glow { border-color: var(--ac-border); box-shadow: 0 4px 20px var(--ac-dim); }

.label {
  font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
  color: var(--tx2); text-transform: uppercase; margin-bottom: 8px;
}
.section-title {
  font-size: 20px; font-weight: 800; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.st-action {
  font-size: 13px; font-weight: 700; color: var(--ac);
  background: none; border: none; cursor: pointer; padding: 0;
}
.muted { color: var(--tx2); }
.dim { color: var(--tx3); }
.tabular { font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; font-family: inherit; font-weight: 700; font-size: 15px;
  padding: 12px 18px; border-radius: var(--r-md); border: none;
  cursor: pointer; min-height: 46px; transition: transform 0.1s ease, opacity 0.15s;
  white-space: nowrap;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.35; pointer-events: none; }
.btn-ac { background: var(--ac); color: #04140A; }
.btn-ghost { background: var(--bg2); color: var(--tx); border: 1px solid var(--bd); }
.btn-danger { background: var(--rd-dim); color: var(--rd); border: 1px solid rgba(255,93,115,0.25); }
.btn-sm { font-size: 13px; padding: 7px 12px; min-height: 36px; border-radius: 10px; }
.btn-xs { font-size: 12px; padding: 5px 9px; min-height: 30px; border-radius: 8px; }
.btn-lg { font-size: 16px; padding: 15px 24px; min-height: 52px; border-radius: var(--r-lg); width: 100%; }

.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 12px; font-weight: 700; color: var(--tx2); margin-bottom: 6px; }
.inp {
  width: 100%; background: var(--bg2); color: var(--tx);
  border: 1.5px solid var(--bd); border-radius: var(--r-sm);
  padding: 11px 14px; font: inherit; font-size: 15px; min-height: 46px;
  transition: border-color 0.18s;
}
.inp:focus { outline: none; border-color: var(--ac); }
.inp::placeholder { color: var(--tx3); }
select.inp { cursor: pointer; }

/* ═══════════════════════════════════════════════════════════
   SEARCH FIRST FOOD EXPERIENCE
═══════════════════════════════════════════════════════════ */
.food-search-box {
  position: relative; margin-bottom: 14px;
}
.food-search-input {
  width: 100%; background: var(--bg2); color: var(--tx);
  border: 2px solid var(--bd); border-radius: 16px;
  padding: 14px 16px 14px 44px; font-size: 16px; font-weight: 600;
  min-height: 52px; transition: border-color 0.18s;
}
.food-search-input:focus { outline: none; border-color: var(--ac); }
.food-search-ic {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  font-size: 18px; color: var(--tx2); pointer-events: none;
}
.food-search-clear {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--tx2); font-size: 16px; cursor: pointer;
}

.food-result-card {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--card); border: 1px solid var(--bd);
  border-radius: var(--r-md); margin-bottom: 8px; cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s;
}
.food-result-card:active { transform: scale(0.98); border-color: var(--ac); }
.food-result-info { flex: 1; min-width: 0; }
.food-result-title { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.food-result-sub { font-size: 12px; color: var(--tx2); margin-top: 2px; }
.food-result-macros {
  font-size: 12px; font-weight: 700; color: var(--tx2); margin-top: 4px;
  display: flex; gap: 8px;
}
.food-result-macros span { font-variant-numeric: tabular-nums; }
.food-result-add {
  width: 36px; height: 36px; border-radius: 50%; background: var(--ac-dim);
  border: 1px solid var(--ac-border); color: var(--ac); font-size: 18px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* Portion modal steppers */
.portion-stepper {
  display: flex; align-items: center; gap: 8px; margin: 12px 0;
}
.portion-btn {
  flex: 1; padding: 10px 4px; font-size: 13px; font-weight: 700;
  border-radius: 10px; border: 1px solid var(--bd); background: var(--bg2);
  color: var(--tx); cursor: pointer; text-align: center;
}
.portion-btn:active { background: var(--ac-dim); border-color: var(--ac); }

/* Accordions for Add Food form */
.accordion {
  border: 1px solid var(--bd); border-radius: var(--r-md);
  margin-bottom: 10px; overflow: hidden; background: var(--card2);
}
.acc-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; cursor: pointer; background: var(--card); user-select: none;
}
.acc-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.acc-icon { font-size: 12px; color: var(--tx2); transition: transform 0.2s ease; }
.accordion.open .acc-icon { transform: rotate(180deg); }
.acc-body { display: none; padding: 14px; background: var(--card2); border-top: 1px solid var(--bd2); }
.accordion.open .acc-body { display: block; }

.nutri-group-title {
  font-size: 12px; font-weight: 800; letter-spacing: 0.06em;
  color: var(--tx2); text-transform: uppercase; margin: 16px 0 8px;
  padding-bottom: 4px; border-bottom: 1px solid var(--bd2);
}
.nutri-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid var(--bd2); font-size: 14px;
}
.nutri-row:last-child { border-bottom: none; }
.nutri-row.sub-item { padding-left: 14px; font-size: 13px; color: var(--tx2); }
.nutri-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.nutri-val.na { color: var(--tx3); font-weight: 400; font-style: italic; }

.pbar { height: 6px; background: var(--bd); border-radius: 3px; overflow: hidden; margin: 5px 0; }
.pbar-fill { height: 100%; border-radius: 3px; background: var(--ac); transition: width 0.3s ease; }
.pbar-fill.carbs { background: var(--bl); }
.pbar-fill.fat { background: var(--yl); }
.pbar-fill.protein { background: var(--rd); }

.ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--bd); }
.ring-fill { fill: none; stroke: var(--ac); stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
.ring-center { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }

.meal-card { background: var(--card); border: 1px solid var(--bd); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 10px; }
.meal-header { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; }
.meal-icon {
  width: 44px; height: 44px; border-radius: 50%; background: var(--bg2);
  border: 2px solid var(--bd); display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.meal-icon.has-food { border-color: var(--ac); }
.meal-info { flex: 1; min-width: 0; }
.meal-name { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.meal-kcal { font-size: 13px; color: var(--tx2); margin-top: 2px; font-weight: 600; }
.meal-preview { font-size: 12px; color: var(--tx3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meal-add {
  width: 38px; height: 38px; border-radius: 50%; background: var(--bg2);
  border: 1.5px solid var(--bd); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; font-size: 20px; color: var(--ac);
  transition: transform 0.15s;
}
.meal-add:active { transform: scale(0.92); }
.meal-items { padding: 0; border-top: 1px solid var(--bd2); }
.meal-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--bd2); cursor: pointer;
}
.meal-item:last-child { border-bottom: none; }
.meal-item-name { flex: 1; font-size: 14px; font-weight: 600; }
.meal-item-g { font-size: 12px; color: var(--tx2); }
.meal-item-kcal { font-size: 14px; font-weight: 700; color: var(--tx2); min-width: 55px; text-align: right; }

/* ═══════════════════════════════════════════════════════════
   WORKOUT TODAY & ACTIVE VIEWS
═══════════════════════════════════════════════════════════ */
.workout-status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.06em; padding: 3px 10px; border-radius: 20px;
}
.workout-status-badge.live { background: var(--ac-dim); color: var(--ac); border: 1px solid var(--ac-border); }
.workout-status-badge.planned { background: var(--bl-dim); color: var(--bl); border: 1px solid rgba(76,157,255,0.25); }
.workout-status-badge.rest { background: var(--pu-dim); color: var(--pu); border: 1px solid rgba(167,139,250,0.25); }
.workout-status-badge.done { background: rgba(0,229,176,0.18); color: var(--ac); }

.exercise-stepper {
  display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none;
}
.exercise-step-chip {
  padding: 6px 12px; border-radius: 12px; font-size: 12px; font-weight: 700;
  background: var(--bg2); border: 1px solid var(--bd); color: var(--tx2);
  white-space: nowrap; display: flex; align-items: center; gap: 6px;
}
.exercise-step-chip.current { border-color: var(--ac); color: var(--ac); background: var(--ac-dim); }
.exercise-step-chip.done { border-color: transparent; background: var(--card2); color: var(--tx); }

.workout-card { background: var(--card); border: 1px solid var(--bd); border-radius: var(--r-lg); padding: 16px; margin-bottom: 12px; }
.set-row {
  display: grid; grid-template-columns: 24px 1fr 1fr 44px 44px;
  gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--bd2);
}
.set-row:last-child { border-bottom: none; }
.set-row.set-done .set-inp { border-color: var(--ac); }
.set-row.set-skip { opacity: 0.4; }
.set-row.set-warm { background: var(--yl-dim); border-radius: 8px; padding: 6px 8px; margin: 0 -8px; }
.set-num { font-size: 13px; color: var(--tx2); font-weight: 700; text-align: center; }
.set-inp {
  background: var(--bg2); border: 1.5px solid var(--bd); border-radius: 8px;
  color: var(--tx); font-family: inherit; font-size: 15px; font-weight: 700;
  text-align: center; padding: 7px 4px; min-height: 38px; font-variant-numeric: tabular-nums;
}
.set-inp:focus { outline: none; border-color: var(--ac); }
.set-btn {
  width: 44px; height: 38px; border-radius: 10px; border: 1.5px solid var(--bd);
  background: var(--bg2); color: var(--tx2); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.set-btn.done-btn { background: var(--ac); border-color: var(--ac); color: #04140A; font-weight: 800; }
.set-btn.skip-btn.active { background: var(--bd); }
.set-extra { display: flex; gap: 6px; padding: 4px 0 6px 30px; }
.set-extra .set-inp { max-width: 70px; font-size: 13px; }
.set-extra .set-inp.full { max-width: none; flex: 1; }

/* ═══════════════════════════════════════════════════════════
   CALENDAR TAB
═══════════════════════════════════════════════════════════ */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day-header { text-align: center; font-size: 11px; font-weight: 800; color: var(--tx2); padding: 4px 0; letter-spacing: 0.04em; }
.cal-cell {
  aspect-ratio: 1; border-radius: 12px; border: 1.5px solid var(--bd2);
  background: var(--bg2); color: var(--tx); font-size: 13px; font-weight: 700;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; padding: 2px; transition: transform 0.1s ease;
}
.cal-cell:active { transform: scale(0.92); }
.cal-cell.today { border-color: var(--tx); }
.cal-cell.selected { border-color: var(--ac); background: var(--ac-dim); }
.cal-dots { display: flex; gap: 2.5px; margin-top: 2px; height: 5px; align-items: center; }
.cal-dot { width: 4.5px; height: 4.5px; border-radius: 50%; }
.cal-dot.workout { background: var(--ac); }
.cal-dot.habit { background: var(--yl); }
.cal-dot.rest { background: var(--bl); }
.cal-dot.missed { background: var(--rd); }

/* Habits */
.habit-check {
  width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--bd);
  background: none; display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-size: 16px; color: transparent;
}
.habit-check.done { background: var(--ac); border-color: var(--ac); color: #04140A; }
.habit-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--bd2); }
.habit-row:last-child { border-bottom: none; }
.habit-info { flex: 1; min-width: 0; }
.habit-name { font-size: 15px; font-weight: 700; }
.habit-meta { font-size: 12px; color: var(--tx2); margin-top: 2px; }

/* Profile rows */
.pref-group { margin-bottom: 22px; }
.pref-group-title {
  font-size: 12px; font-weight: 800; color: var(--tx2); letter-spacing: 0.08em;
  text-transform: uppercase; margin-bottom: 8px; padding: 0 4px;
}
.pref-card { background: var(--card); border: 1px solid var(--bd); border-radius: var(--r-lg); overflow: hidden; }
.pref-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--bd2); gap: 12px; }
.pref-row:last-child { border-bottom: none; }
.pref-ic { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
.pref-label { flex: 1; font-size: 15px; font-weight: 700; }
.pref-arrow { color: var(--tx3); font-size: 16px; }

/* Quick stats */
.qstat { background: var(--card); border: 1px solid var(--bd); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.qstat-ic { font-size: 20px; margin-bottom: 2px; }
.qstat-val { font-size: 24px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.qstat-label { font-size: 11px; color: var(--tx2); font-weight: 700; }
.qstat-ctrl { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.qstat-ctrl .btn { flex: 1; font-size: 18px; font-weight: 800; padding: 4px; min-height: 34px; border-radius: 8px; }

.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.week-bars { display: flex; align-items: flex-end; gap: 4px; height: 60px; }
.week-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
.week-bar-track { flex: 1; width: 100%; background: var(--bd); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.week-bar-fill { background: var(--ac); border-radius: 4px; transition: height 0.4s ease; }
.week-bar-fill.rest-bar { background: var(--bl); }
.week-bar-label { font-size: 10px; color: var(--tx2); font-weight: 700; }

.emo-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin: 8px 0; }
.emo-btn { font-size: 22px; background: var(--bg2); border: 2px solid transparent; border-radius: 10px; min-height: 40px; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.emo-btn.on { border-color: var(--ac); background: var(--ac-dim); }

.hint { font-size: 13px; color: var(--ac); background: var(--ac-dim); border: 1px solid var(--ac-border); border-radius: 10px; padding: 8px 12px; margin: 6px 0; line-height: 1.4; }
.hint.warn { color: var(--yl); background: var(--yl-dim); border-color: rgba(255,209,102,0.25); }

.hist-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bd2); }
.hist-row:last-child { border-bottom: none; }
.hist-name { flex: 1; font-size: 14px; font-weight: 700; }
.hist-meta { font-size: 12px; color: var(--tx2); }
.hist-val { font-size: 14px; font-weight: 700; color: var(--tx2); }

.chart-wrap svg { width: 100%; height: 85px; overflow: visible; }
.chart-label { font-size: 11px; color: var(--tx2); text-align: right; margin-top: 4px; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--tx2); }
.empty-icon { font-size: 42px; display: block; margin-bottom: 10px; opacity: 0.6; }
.empty-title { font-size: 17px; font-weight: 800; color: var(--tx); margin-bottom: 4px; }
.empty-sub { font-size: 13px; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.22s ease both; }


/* Extra styling for language, habits, and interactive analytics */
.lang-badge { display:inline-flex; align-items:center; font-size:11px; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--ac-dim); color:var(--ac); border:1px solid var(--ac-border); text-transform:uppercase; }
.day-selector { display:flex; gap:6px; margin:6px 0 12px; }
.day-pill { flex:1; padding:8px 0; border-radius:8px; font-size:12px; font-weight:700; background:var(--bg2); color:var(--tx2); border:1px solid var(--bd); text-align:center; cursor:pointer; user-select:none; }
.day-pill.on { background:var(--ac); color:#000; border-color:var(--ac); font-weight:800; }
.chart-point { cursor:pointer; transition:r 0.15s ease, stroke-width 0.15s ease; }
.chart-point:hover { r:7 !important; stroke-width:3 !important; }
.source-tag { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; background:rgba(255,255,255,0.06); border:1px solid var(--bd); color:var(--tx2); }
.source-tag.official { background:rgba(0,229,176,0.12); border-color:rgba(0,229,176,0.3); color:var(--ac); }
.source-tag.manufacturer { background:rgba(76,157,255,0.12); border-color:rgba(76,157,255,0.3); color:var(--bl); }
.filter-bar { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; -webkit-overflow-scrolling:touch; }
.filter-bar::-webkit-scrollbar { display:none; }
.pill-btn { white-space:nowrap; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:700; background:var(--card); color:var(--tx2); border:1px solid var(--bd); cursor:pointer; transition:all 0.15s ease; }
.pill-btn.on { background:var(--ac); color:#000; border-color:var(--ac); font-weight:800; }
.stat-card-clickable { cursor:pointer; transition:transform 0.1s ease, border-color 0.15s ease; }
.stat-card-clickable:active { transform:scale(0.98); }
.stat-card-clickable:hover { border-color:var(--ac-border); }
.clickable-badge { cursor:pointer; transition:all 0.15s ease; }

.badge-custom { background:rgba(255,209,102,0.15); color:var(--yl); border:1px solid rgba(255,209,102,0.3); font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; }

function parseNutrients(obj) {
  if (!obj) return {};
  const res = {};
  NUTRIENTS_SPEC.forEach(spec => {
    const k = spec.key;
    if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') {
      res[k] = +obj[k] || 0;
    }
  });
  return res;
}

function migrate(o) {
  if (!o || typeof o !== 'object') o = def();
  o.settings = o.settings || {};
  if (!o.settings.lang) o.settings.lang = 'de';
  if (!o.settings.unit) o.settings.unit = 'kg';
  if (!o.settings.theme) o.settings.theme = 'dark';
  if (!o.settings.rest) o.settings.rest = 90;
  if (!o.settings.bw) o.settings.bw = 75;
  if (!o.settings.goal) o.settings.goal = 4;
  if (!o.settings.macroGoals) o.settings.macroGoals = { kcal: 2200, carbs: 250, fat: 70, protein: 150 };

  o.routines = Array.isArray(o.routines) ? o.routines : [];
  o.workoutLogs = Array.isArray(o.workoutLogs) ? o.workoutLogs : [];
  o.habits = o.habits || { list: [], log: {} };
  o.habits.list = Array.isArray(o.habits.list) ? o.habits.list : [];
  o.habits.log = (o.habits.log && typeof o.habits.log === 'object') ? o.habits.log : {};

  o.food = (o.food && typeof o.food === 'object') ? o.food : {};
  // Keep user custom foods in foodDb!
  o.foodDb = Array.isArray(o.foodDb) ? o.foodDb : [];

  o.water = o.water || {};
  o.sleep = o.sleep || {};
  o.steps = o.steps || {};
  o.bodyweight = o.bodyweight || {};
  o.calendar = o.calendar || {};

  // Seed sample routine if empty
  if (!o.routines.length) {
    o.routines = [
      { id: uid(), name: 'Upper Body Power', exercises: [
        { id: uid(), name: 'Klimmzüge / Pull-Ups', unit: 'kg', bw: 'plus', w: 0, sets: 3, reps: 8, rest: 90 },
        { id: uid(), name: 'Dips', unit: 'kg', bw: 'plus', w: 0, sets: 3, reps: 10, rest: 90 },

        { id: uid(), name: 'Seitheben', unit: 'kg', bw: 'none', w: 10, sets: 3, reps: 12, rest: 60 }
      ]}
    ];
  }

  // Seed sample habits if empty
  if (!o.habits.list.length) {
    o.habits.list = [
      { id: uid(), name: '2.5L Wasser trinken', emoji: '💧', cat: 'Anytime', unit: 'check', target: 1, freq: 'daily', wtarget: 7, days: [1,2,3,4,5,6,7] },

    ];
  }

  o.version = 7;
  return o;
}

function debounce(fn, ms) {
  let t;
  const deb = function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };

  return deb;
}

// Unit Conversion
function gu() { return S.settings.unit || 'kg'; }
function cv(w, toUnit) {
  const u = toUnit || gu();
  if (w == null) return 0;
  if (u === 'lbs') return +(w * 2.20462).toFixed(1);
  return +w;
}
function fk(w, fromUnit) {
  const u = fromUnit || gu();
  if (w == null || w === '') return null;
  const n = parseFloat(w);
  if (isNaN(n)) return null;
  if (u === 'lbs') return +(n / 2.20462).toFixed(2);
  return +n.toFixed(2);
}

function curBW() {
  const k = dk();
  if (S.bodyweight[k] != null) return S.bodyweight[k];
  const keys = Object.keys(S.bodyweight).sort();
  if (keys.length) return S.bodyweight[keys[keys.length - 1]];
  return S.settings.bw || 75;
}

function load(e, w) {
  const b = curBW(), u = e.unit || gu();
  let v = num(w);
  if (u === 'lbs') v = v / 2.20462;
  if (e.bw === 'bw') return b;
  if (e.bw === 'plus') return b + v;
  if (e.bw === 'minus') return Math.max(0, b - v);
  return v;
}

  if (!id) return null;
  // First look in custom foodDb, then in starter catalogue
  const custom = (S.foodDb || []).find(f => f.id === id);
  if (custom) return custom;
  return DEFAULT_STARTER_FOODS.find(f => f.id === id) || null;
}

function calcFoodPortion(item, grams) {
  const ratio = (grams || 100) / 100;
  const p = {
    grams,
    kcal: Math.round((item.kcal || 0) * ratio),
    kj: item.kj != null ? Math.round(item.kj * ratio) : null,
    carbs: +( (item.carbs || 0) * ratio ).toFixed(1),
    fat: +( (item.fat || 0) * ratio ).toFixed(1),
    protein: +( (item.protein || 0) * ratio ).toFixed(1),
    nutrients: {}
  };
  const src = item.nutrients || {};
  NUTRIENTS_SPEC.forEach(spec => {
    const k = spec.key;
    if (src[k] != null) {
      p.nutrients[k] = +(src[k] * ratio).toFixed(spec.unit === 'g' || spec.unit === 'mg' ? 2 : 1);
    } else {
      p.nutrients[k] = null;
    }
  });
  return p;
}

function mealTotals(entries) {
  const t = { kcal: 0, carbs: 0, fat: 0, protein: 0, nutrients: {} };
  if (!entries || !entries.length) return t;
  entries.forEach(e => {
    t.kcal += e.kcal || 0;
    t.carbs += e.carbs || 0;
    t.fat += e.fat || 0;
    t.protein += e.protein || 0;
    const n = e.nutrients || {};
    Object.keys(n).forEach(k => {
      if (n[k] != null) t.nutrients[k] = (t.nutrients[k] || 0) + n[k];
    });
  });
  return t;
}

function dayTotals(date) {
  const d = S.food[date] || {};
  const t = { kcal: 0, carbs: 0, fat: 0, protein: 0, nutrients: {} };
  MEALS.forEach(m => {
    const mt = mealTotals(d[m] || []);
    t.kcal += mt.kcal;
    t.carbs += mt.carbs;
    t.fat += mt.fat;
    t.protein += mt.protein;
    Object.keys(mt.nutrients).forEach(k => {
      t.nutrients[k] = (t.nutrients[k] || 0) + mt.nutrients[k];
    });
  });
  return t;
}

function getRecentFoods() {
  const seen = new Set();
  const list = [];
  const dates = Object.keys(S.food).sort().reverse();
  for (const d of dates) {
    const day = S.food[d];
    for (const m of MEALS) {
      for (const item of (day[m] || [])) {
        const key = (item.dbId || item.name).toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          list.push(item);
          if (list.length >= 12) return list;
        }
      }
    }
  }
  return list;
}

// Workout PRs & Analytics Helpers
function lastEx(name) {
  for (let i = S.workoutLogs.length - 1; i >= 0; i--) {
    const found = (S.workoutLogs[i].exs || []).find(e => e.name === name);
    if (found) return found;
  }
  return null;
}

function suggestSets(e) {
  const last = lastEx(e.name);
  if (last && last.sets && last.sets.length) {
    return last.sets.map(s => ({ w: s.w, r: s.r, rpe: null, note: '', done: false, skip: false, warm: !!s.warm }));
  }
  const count = e.sets || 3;
  const arr = [];
  for (let i = 0; i < count; i++) {
    arr.push({ w: e.w || 0, r: e.reps || 10, rpe: null, note: '', done: false, skip: false, warm: false });
  }
  return arr;
}

function currentPR(name) {
  let maxW = 0, maxE = 0, bestSet = null;
  S.workoutLogs.forEach(l => (l.exs || []).forEach(e => {
    if (e.name !== name) return;
    (e.sets || []).forEach(s => {
      if (s.done === false || s.warm) return;
      const L = load(e, s.w), r = +s.r || 0, e1 = L * (1 + r / 30);
      if (L > maxW) maxW = L;
      if (e1 > maxE) { maxE = e1; bestSet = { w: L, r, e1 }; }
    });
  }));
  return { maxW, maxE, bestSet };
}

function rmOutput(u) {
  const w = parseFloat(ui.rm.w) || 0, r = parseInt(ui.rm.r) || 1;
  if (!w || !r) return '<div class="muted">Gültige Werte eingeben.</div>';
  const e1 = w * (1 + r / 30);
  const pcts = [100, 95, 90, 85, 80, 75, 70, 65, 60, 50];
  return `
    <div style="font-size:24px;font-weight:800;color:var(--ac);margin-bottom:8px">${Math.round(e1)} ${u} <span style="font-size:13px;color:var(--tx2);font-weight:600">e1RM</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px">
      ${pcts.map(p => `<div><span class="muted">${p}%:</span> <b>${Math.round(e1 * p / 100)} ${u}</b></div>`).join('')}
    </div>`;
}

function calDotsForDay(k) {
  const hasW = S.workoutLogs.some(l => l.date === k);
  const hasH = Object.keys(S.habits.log[k] || {}).some(id => !!S.habits.log[k][id]);
  const hasF = S.food[k] && Object.keys(S.food[k]).some(m => (S.food[k][m]||[]).length > 0);
  return { workout: hasW, habits: hasH, food: hasF };
}

function streak(okFn) {
  let s = 0;
  const d = new Date();
  // check today
  if (!okFn(dk(d))) d.setDate(d.getDate() - 1);
  while (okFn(dk(d))) {
    s++;
    d.setDate(d.getDate() - 1);
  }
  return s;
}

function volOf(log) {
  return (log.exs || []).reduce((a, e) => a + (e.sets || []).reduce((sa, s) => {
    if (s.done === false || s.warm) return sa;
    return sa + load(e, s.w) * (+s.r || 0);
  }, 0), 0);
}

// Interactive SVG Line Chart
function svgLineDated(points, labelUnit = '') {
  if (!points || points.length < 2) return `<div class="muted" style="text-align:center;padding:24px 0">${t('no_data_period')}</div>`;
  const vals = points.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const w = 320, h = 90, pad = 12;

  const pts = points.map((p, i) => {
    const x = pad + (i / (points.length - 1)) * (w - pad * 2);
    const y = h - pad - ((p.v - min) / range) * (h - pad * 2);
    return { x: +x.toFixed(1), y: +y.toFixed(1), d: p.d, v: p.v, label: p.label || '' };
  });

  const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const area = `${path} L ${pts[pts.length - 1].x} ${h} L ${pts[0].x} ${h} Z`;

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible">
      <defs>
        <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--ac)" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="var(--ac)" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      <path d="${area}" fill="url(#chartGrad)"/>
      <path d="${path}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(p => `
        <circle class="chart-point" cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--bg)" stroke="var(--ac)" stroke-width="2"
          data-action="chartPointDetail" data-date="${p.d}" data-val="${p.v}" data-unit="${labelUnit}" data-label="${esc(p.label)}"/>
      `).join('')}
    </svg>`;
}

function ring(pct, r, sw, colorClass) {
  const c = 2 * Math.PI * r;
  const offset = c - (Math.min(100, Math.max(0, pct)) / 100) * c;
  return `
    <circle class="ring-bg" cx="${r+sw}" cy="${r+sw}" r="${r}" stroke-width="${sw}"></circle>
    <circle class="ring-fg ${colorClass || ''}" cx="${r+sw}" cy="${r+sw}" r="${r}" stroke-width="${sw}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>`;
}

function foodSearchPageHTML() {
  const query = (ui.fsQuery || '').toLowerCase().trim();

  const allFoods = getAllSearchableFoods();
  const recentFoods = getRecentFoods();

  let results = [];
  if (cat === 'Recent') {
    results = recentFoods;
  } else if (cat === 'Custom') {
    results = S.foodDb || [];
  } else {
    results = allFoods.filter(f => {
      if (cat !== 'All' && f.category !== cat) return false;
      if (!query) return true;
      const n1 = (f.name || '').toLowerCase();
      const n2 = (f.nameEn || '').toLowerCase();
      const b = (f.brand || '').toLowerCase();
      const a = (f.aliases || []).map(x => x.toLowerCase()).join(' ');
      return n1.includes(query) || n2.includes(query) || b.includes(query) || a.includes(query);

      ${FOOD_CATS.filter(c => c !== 'All').map(c => `
        <button class="pill-btn ${cat===c?'on':''}" data-action="fsFilterCat" data-cat="${c}">${foodCatLabel(c)}</button>

    <!-- Search Results -->

                <b>${Math.round(item.kcal)} kcal</b> / 100g ·
                <span style="color:var(--tx2)">${item.carbs}g C · ${item.protein}g P · ${item.fat}g F</span>

function renderNutrientBreakdownTable(item, activeGrams) {
  const p = calcFoodPortion(item, activeGrams);
  const isDe = curLang() === 'de';

  const groups = [
    { cat: 'carbs', title: isDe ? 'Kohlenhydrat-Details' : 'Carbohydrate Details' },
    { cat: 'fats', title: isDe ? 'Fettsäuren & Fette' : 'Fats & Fatty Acids' },
    { cat: 'vitamins', title: isDe ? 'Vitamine' : 'Vitamins' },
    { cat: 'minerals', title: isDe ? 'Mineralstoffe & Spurenelemente' : 'Minerals & Trace Elements' },
    { cat: 'other', title: isDe ? 'Weitere Nährwerte' : 'Additional Nutrients' }
  ];

  return groups.map(g => {
    const list = NUTRIENTS_SPEC.filter(s => s.cat === g.cat);
    return `
      <div class="nutri-group-title">${g.title}</div>
      ${list.map(spec => {
        const val = p.nutrients[spec.key];
        const label = isDe ? spec.labelDe : spec.labelEn;
        const rdv = spec.rdv;
        const pct = (rdv && val != null) ? Math.min(100, Math.round(val / rdv * 100)) : null;

        return `
          <div class="nutri-row">
            <span>${label}</span>
            <span class="nutri-val ${val == null ? 'na' : ''}">
              ${val != null ? fmt(val) + ' ' + spec.unit : t('not_available')}
              ${pct != null ? ` <span style="font-size:11px;color:var(--tx2)">(${pct}% NRV)</span>` : ''}
            </span>
          </div>`;
      }).join('')}`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════

function vCalendar() {
  const y = ui.calYear, m = ui.calMonth;
  const firstDay = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const startOffset = (firstDay.getDay() + 6) % 7;

  const monthName = firstDay.toLocaleDateString(curLang()==='de'?'de-DE':'en-US', { month: 'long', year: 'numeric' });
  const activeDate = ui.calSelectedDay || dk();

  const dayCells = [];
  for (let i = 0; i < startOffset; i++) dayCells.push('<div class="cal-day other-month"></div>');

  for (let d = 1; d <= daysInMonth; d++) {
    const thisDate = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = thisDate === dk();
    const isSelected = thisDate === activeDate;
    const dots = calDotsForDay(thisDate);

    dayCells.push(`
      <div class="cal-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-action="calSelectDay" data-date="${thisDate}">
        <div class="cal-day-num">${d}</div>
        <div class="cal-dots">
          ${dots.workout ? '<span class="cal-dot workout" title="Training"></span>' : ''}
          ${dots.habits ? '<span class="cal-dot habits" title="Gewohnheiten"></span>' : ''}
          ${dots.food ? '<span class="cal-dot rest" title="Ernährung"></span>' : ''}
        </div>
      </div>`);
  }

  // Selected date breakdown
  const wLogs = S.workoutLogs.filter(l => l.date === activeDate);
  const dt = dayTotals(activeDate);
  const habitsLogged = Object.entries(S.habits.log[activeDate] || {}).filter(([_, v]) => !!v);

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="section-title">${t('calendar_title')}</div>
      <button class="btn btn-ghost btn-sm" data-action="calToday">${t('jump_to_today')}</button>
    </div>

    <div class="card card-lg" style="margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <button class="btn btn-ghost btn-sm" data-action="calPrevMonth">‹</button>
        <div style="font-size:18px;font-weight:800">${monthName}</div>
        <button class="btn btn-ghost btn-sm" data-action="calNextMonth">›</button>
      </div>

      <!-- Days Header -->

      ${dt.kcal > 0 ? `

            }).join('')}

      ` : ''}

      ${!wLogs.length && dt.kcal === 0 && !habitsLogged.length ? `
        <div class="muted" style="font-size:13px">${t('no_activity_logged')}</div>
      ` : ''}
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════
//  6. INTERACTIVE ANALYTICS SUBPAGE
// ═══════════════════════════════════════════════════════════
function progressPageHTML() {
  const sub = ui.pSub || 'overview';
  const range = ui.pRange || '30d';
  const u = gu();

  const subtabs = `
    <div class="seg-control" style="margin-bottom:12px">
      ${[['overview', t('tab_overview')], ['workout', t('tab_workout_prs')], ['body', t('tab_bodyweight')], ['habits', t('tab_habits_analytics')]].map(([id, lb]) => `
        <button class="seg-btn ${sub === id ? 'on' : ''}" data-action="pSub" data-id="${id}">${lb}</button>`).join('')}
    </div>`;

  const rangeButtons = `
    <div class="filter-bar" style="margin-bottom:14px">
      ${[['7d', t('period_7d')], ['30d', t('period_30d')], ['3m', t('period_3m')], ['1y', t('period_1y')], ['all', t('period_all')]].map(([k, lb]) => `
        <button class="pill-btn ${range === k ? 'on' : ''}" data-action="pRange" data-id="${k}">${lb}</button>
      `).join('')}
    </div>`;

  let content = '';

  // Calculate days for selected range
  let numDays = 30;
  if (range === '7d') numDays = 7;
  else if (range === '30d') numDays = 30;
  else if (range === '3m') numDays = 90;
  else if (range === '1y') numDays = 365;
  else if (range === 'all') numDays = 730;

  const dateList = Array.from({ length: numDays }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - (numDays - 1 - i) + (ui.pOffset * numDays));
    return dk(d);
  });
  const startDate = dateList[0], endDate = dateList[dateList.length - 1];

  const periodNavigator = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:var(--card);padding:8px 12px;border-radius:10px;border:1px solid var(--bd)">
      <button class="btn btn-ghost btn-sm" data-action="pNav" data-dir="-1">‹</button>
      <div style="font-size:13px;font-weight:700">${startDate} — ${endDate}</div>
      <button class="btn btn-ghost btn-sm" data-action="pNav" data-dir="1" ${ui.pOffset >= 0 ? 'disabled' : ''}>›</button>
    </div>`;

  if (sub === 'overview') {
    const filteredLogs = S.workoutLogs.filter(l => l.date >= startDate && l.date <= endDate);
    const totalVol = filteredLogs.reduce((a, l) => a + volOf(l), 0);
    const avgVol = filteredLogs.length ? Math.round(totalVol / filteredLogs.length) : 0;

    // Build volume trend series
    const volPoints = dateList.map(d => {
      const logs = S.workoutLogs.filter(l => l.date === d);
      const v = logs.reduce((a, l) => a + volOf(l), 0);
      return { d, v: Math.round(cv(v, u)), label: logs.map(l => l.name).join(', ') };
    }).filter(p => p.v > 0);

    content = `
      ${periodNavigator}
      <div class="g2" style="margin-bottom:12px">
        <div class="qstat stat-card-clickable" data-action="openStatDetail" data-stat="workouts" data-val="${filteredLogs.length}">
          <div class="qstat-val">${filteredLogs.length}</div>
          <div class="qstat-label">${t('workouts_this_week')}</div>
        </div>
        <div class="qstat stat-card-clickable" data-action="openStatDetail" data-stat="volume" data-val="${Math.round(cv(totalVol, u))} ${u}">
          <div class="qstat-val">${Math.round(cv(totalVol, u))} ${u}</div>
          <div class="qstat-label">${t('volume_this_week')}</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div class="label">${t('training_volume_trend')}</div>
          <span style="font-size:11px;color:var(--tx2)">Tippe auf Punkte für Details</span>
        </div>
        <div class="chart-wrap">
          ${svgLineDated(volPoints.length > 1 ? volPoints : dateList.slice(-7).map(d => ({ d, v: 0 })), u)}
        </div>
      </div>`;
  }

  if (sub === 'workout') {
    const pb = {};
    S.workoutLogs.forEach(l => (l.exs || []).forEach(e => (e.sets || []).forEach(s => {
      if (s.done === false || s.warm) return;
      const L = load(e, s.w), r = +s.r || 0, p = pb[e.name] || (pb[e.name] = { w: 0, r: 0, e: 0, date: l.date });
      if (L > p.w) { p.w = L; p.r = r; p.e = L * (1 + r / 30); p.date = l.date; }
    })));

    content = `
      <div class="card" style="margin-bottom:14px">
        <div class="label" style="margin-bottom:12px">${t('personal_records')}</div>
        ${Object.keys(pb).length ? Object.keys(pb).sort().map(n => `
          <div class="hist-row stat-card-clickable" data-action="openPRDetail" data-name="${esc(n)}" data-w="${Math.round(cv(pb[n].w, u))}" data-r="${pb[n].r}">
            <div class="hist-name">${esc(n)}</div>
            <div style="text-align:right">
              <div class="hist-val">${Math.round(cv(pb[n].w, u))} ${u} × ${pb[n].r}</div>
              <div class="hist-meta">e1RM: ${Math.round(cv(pb[n].e, u))} ${u}</div>
            </div>
          </div>
        `).join('') : `<div class="muted" style="font-size:14px">Noch keine Sätze geloggt.</div>`}
      </div>

      <div class="card">
        <div class="label" style="margin-bottom:12px">${t('one_rm_calculator')}</div>
        <div class="g2">
          <div class="field"><label class="field-label">${t('weight')} (${u})</label><input class="inp" inputmode="decimal" value="${esc(ui.rm.w)}" data-change="rmw"></div>
          <div class="field"><label class="field-label">${t('reps')}</label><input class="inp" inputmode="numeric" value="${esc(ui.rm.r)}" data-change="rmr"></div>
        </div>
        <div id="rmOut" style="margin-top:8px">${rmOutput(u)}</div>
      </div>`;
  }

  if (sub === 'body') {
    const bwKeys = Object.keys(S.bodyweight).filter(d => d >= startDate && d <= endDate).sort();
    const bwPoints = bwKeys.map(d => ({ d, v: +cv(S.bodyweight[d], u).toFixed(1), label: `${d}: ${cv(S.bodyweight[d], u)} ${u}` }));

    content = `
      ${periodNavigator}
      <div class="card" style="margin-bottom:14px">
        <div class="label" style="margin-bottom:10px">${t('bodyweight_trend')}</div>
        ${bwPoints.length > 1 ? `
          <div class="chart-wrap">${svgLineDated(bwPoints, u)}</div>
          <div class="chart-label">${t('bodyweight_today')}: ${cv(curBW(), u)} ${u}</div>
        ` : `
          <div class="empty-state">
            <span class="empty-icon">⚖️</span>
            <div class="empty-title">Keine Gewichtsdaten im Zeitraum</div>
            <div class="empty-sub">Erfasse dein Körpergewicht unter Profil.</div>
          </div>
        `}
      </div>`;
  }

  if (sub === 'habits') {
    const habits = S.habits.list;
    content = habits.length ? `
      ${periodNavigator}
      <div style="display:flex;flex-direction:column;gap:10px">
        ${habits.map(h => {
          const doneCount = dateList.filter(d => hv(d, h.id)).length;
          const pct = Math.round(doneCount / dateList.length * 100);
          return `
            <div class="card stat-card-clickable" data-action="habdetail" data-id="${h.id}">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                <div style="display:flex;align-items:center;gap:10px">
                  <span style="font-size:22px">${esc(h.emoji)}</span>
                  <div>
                    <div style="font-size:15px;font-weight:800">${esc(h.name)}</div>
                    <div class="muted" style="font-size:12px">${catLabel(h.cat)} · ${doneCount}/${dateList.length} ${t('days')}</div>
                  </div>
                </div>
                <div style="font-size:18px;font-weight:800;color:var(--ac)">${pct}%</div>
              </div>
              <div class="pbar"><div class="pbar-fill" style="width:${pct}%"></div></div>
            </div>`;
        }).join('')}
      </div>
    ` : `
      <div class="empty-state">
        <span class="empty-icon">✅</span>
        <div class="empty-title">Keine Gewohnheiten angelegt</div>
      </div>`;
  }

  return `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" data-action="closeSubpage">← ${t('back')}</button>
      <div style="font-size:20px;font-weight:800">${t('analytics_title')}</div>
    </div>
    ${subtabs}
    ${rangeButtons}
    ${content}
  `;
}

// ═══════════════════════════════════════════════════════════
//  7. HABITS MANAGEMENT SUBPAGE (VISIBLE + BUTTON & FULL CRUD)
// ═══════════════════════════════════════════════════════════
function habitsPageHTML() {
  const hd = ui.hd || dk();
  const isToday = hd === dk();
  const prevDate = new Date(hd + 'T12:00:00'); prevDate.setDate(prevDate.getDate() - 1);
  const nextDate = new Date(hd + 'T12:00:00'); nextDate.setDate(nextDate.getDate() + 1);

  const habits = S.habits.list;
  const doneHabits = habits.filter(h => !!hv(hd, h.id));
  const pct = habits.length ? Math.round(doneHabits.length / habits.length * 100) : 0;

  return `
    <!-- Top Bar with Visible + Action -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn btn-ghost btn-sm" data-action="closeSubpage">← ${t('back')}</button>
        <div style="font-size:20px;font-weight:800">${t('habits_title')}</div>
      </div>
      <button class="btn btn-ac btn-sm" data-action="habmodal">${t('new_habit')}</button>
    </div>

    <!-- Date Navigation -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" data-action="hdnav" data-id="${dk(prevDate)}">‹</button>
      <div style="text-align:center">
        <div style="font-size:16px;font-weight:800">${isToday ? t('today') : hd}</div>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="hdnav" data-id="${dk(nextDate)}" ${hd >= dk() ? 'disabled' : ''}>›</button>
    </div>

    <!-- Completion Ring Card -->
    <div class="card card-lg" style="margin-bottom:14px;display:flex;align-items:center;gap:16px">
      <div class="ring-wrap">
        <svg width="74" height="74" viewBox="0 0 74 74">
          ${ring(pct, 29, 8)}
        </svg>
        <div class="ring-center" style="width:74px;height:74px">
          <div style="font-size:16px;font-weight:800">${pct}%</div>
        </div>
      </div>
      <div>
        <div style="font-size:22px;font-weight:800">${doneHabits.length} / ${habits.length}</div>
        <div class="muted" style="font-size:13px">${t('habits_completed')}</div>
      </div>
    </div>

    <!-- Daily Habit Checklist -->
    <div style="display:flex;flex-direction:column;gap:8px">
      ${habits.length ? habits.map(h => {
        const isDone = !!hv(hd, h.id);
        const curS = streak(k => !!hv(k, h.id));
        return `
          <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px">
            <div style="display:flex;align-items:center;gap:12px;flex:1" data-action="habdetail" data-id="${h.id}">
              <span style="font-size:24px">${esc(h.emoji)}</span>
              <div>
                <div style="font-size:15px;font-weight:800">${esc(h.name)}</div>
                <div class="muted" style="font-size:12px">${catLabel(h.cat)} · 🔥 ${curS} ${t('days')} Serie</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <button class="btn ${isDone ? 'btn-ac' : 'btn-ghost'} btn-sm" style="font-size:15px;padding:6px 12px" data-action="habdone" data-id="${h.id}" data-date="${hd}">
                ${isDone ? '✓' : '○'}
              </button>
              <button class="btn btn-ghost btn-xs" data-action="habedit" data-id="${h.id}">✏️</button>
              <button class="btn btn-ghost btn-xs" data-action="habdel" data-id="${h.id}" style="color:var(--rd)">🗑</button>
            </div>

const VIEWS = { today: vToday, workout: vWorkout, food: vFood, calendar: vCalendar, profile: vProfile };

function render() {

  applyTheme();
  syncInputs();
