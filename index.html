function syncInputs() {
  const o = $('rmOut'); if (o) o.innerHTML = rmOutput(gu());
}

let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) {}
}
function beep() {
  try {
    unlockAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  } catch(e) {}
}

let timerIv = null;
function startTimer(sec) {
  const d = sec || S.settings.rest || 90;
  S.timer = { start: Date.now(), dur: d, end: Date.now() + d * 1000 };
  save(); renderTimerBar();
  if (timerIv) clearInterval(timerIv);
  timerIv = setInterval(tickTimer, 250);
}
function stopTimer() {
  if (timerIv) clearInterval(timerIv);
  timerIv = null; S.timer = null; save(); hideTimerBar();
}
function tickTimer() {
  const tm = S.timer;
  if (!tm) { hideTimerBar(); clearInterval(timerIv); return; }
  const rem = Math.max(0, Math.ceil((tm.end - Date.now()) / 1000));
  const el = $('tbar-time'), f = $('tbar-fill');
  if (el) el.textContent = `${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`;
  if (f) { const pct = Math.max(0, Math.min(100, (1 - (tm.end - Date.now())/(tm.dur*1000)) * 100)); f.style.width = pct + '%'; }
  if (rem <= 0) {
    stopTimer(); beep();
    if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch(e) {} }
    toast('⏱️ Pause beendet!');
  }
}
function renderTimerBar() {
  const b = $('tbar'); if (!b) return;
  b.classList.add('show');
  document.documentElement.style.setProperty('--tbar-h', b.offsetHeight + 4 + 'px');
  tickTimer();
}
function hideTimerBar() {
  const b = $('tbar'); if (!b) return;
  b.classList.remove('show');
  document.documentElement.style.setProperty('--tbar-h', '0px');
}

// Workout Sessions
function startWorkout(rid) {
  let name = 'Freies Training', exs = [], hadHistory = false;
  if (rid !== 'free') {
    const r = S.routines.find(x => x.id === rid);
    if (!r) { toast('Plan nicht gefunden'); return; }
    name = r.name;
    exs = r.exercises.map(e => {
      if (lastEx(e.name)) hadHistory = true;
      return { name: e.name, unit: e.unit, bw: e.bw, rest: e.rest || 0, sets: suggestSets(e) };
    });
  }
  S.activeWorkout = { date: dk(), start: Date.now(), rid, name, paused: false, exs };
  save();
  toast(hadHistory ? 'Training gestartet 💪 · Sätze geladen' : 'Training gestartet 💪');
}

function finishWorkout() {
  const a = S.activeWorkout; if (!a) return;
  if (!a.exs.some(e => e.sets.some(s => s.done))) { toast('Markiere mindestens einen Satz als erledigt.'); return; }
  S.workoutLogs.push({ id: uid(), date: a.date, name: a.name, start: a.start, end: Date.now(), exs: a.exs });
  S.activeWorkout = null; S.timer = null; save(); hideTimerBar();
  const vol = Math.round(cv(volOf(S.workoutLogs[S.workoutLogs.length-1]), gu()));
  ui.wSub = 'history'; render(); toast(`Training gespeichert ✅ · ${vol} ${gu()} Volumen`);
}

// ═══════════════════════════════════════════════════════════
//  CENTRAL ROUTER & EVENT HANDLER
// ═══════════════════════════════════════════════════════════
function handleClick(e) {
  const emo = e.target.closest('[data-pick-emoji]');
  if (emo) {
    $('habEmoji').value = emo.getAttribute('data-pick-emoji');
    emo.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    emo.classList.add('on');
    return;
  }

  const b = e.target.closest('[data-action]'); if (!b) return;
  const ds = b.dataset, id = ds.id, today = dk();

  switch(ds.action) {
    case 'noop': break;
    case 'nav': {
      const prev = ui.tab; ui.tab = id;
      if (prev !== id) $('main').scrollTop = 0;
      render(); break;
    }
    case 'wSub': ui.wSub = id; render(); break;
    case 'pSub': ui.pSub = id; render(); break;
    case 'close': closeModal(); break;
    case 'confirmyes': if (confirmCb) { const fn = confirmCb; confirmCb = null; closeModal(); fn(); } break;
    case 'closeSubpage': closeSubpage(); break;

    // Unit, Theme & Language
    case 'setUnit': S.settings.unit = id; save(); render(); toast(`Einheit: ${id.toUpperCase()}`); break;
    case 'setTheme': S.settings.theme = id; applyTheme(); save(); render(); break;
    case 'setLang': {
      S.settings.lang = id; save();
      render();
      if ($('subpage').classList.contains('show')) {
        // If subpage is open, refresh it
        if (ui.subpageType === 'habits') openSubpage(habitsPageHTML());
        else if (ui.subpageType === 'progress') openSubpage(progressPageHTML());
        else if (ui.subpageType === 'foodSearch') openSubpage(foodSearchPageHTML());
      }
      toast(id === 'de' ? 'Sprache auf Deutsch umgestellt 🇩🇪' : 'Language set to English 🇬🇧');
      break;
    }

    // Workout Actions
    case 'navWorkoutTab': ui.tab = 'workout'; if (ds.sub) ui.wSub = ds.sub; render(); break;
    case 'resumeActiveWorkout': ui.tab = 'workout'; ui.wSub = 'active'; render(); break;
    case 'startWorkoutAndOpenActive': startWorkout(id); ui.tab = 'workout'; ui.wSub = 'active'; render(); break;
    case 'togglePauseWorkout':
      if (S.activeWorkout) {
        S.activeWorkout.paused = !S.activeWorkout.paused;
        save(); render();
        toast(S.activeWorkout.paused ? 'Training pausiert ⏸' : 'Training fortgesetzt ▶');
      }
      break;
    case 'finishw': finishWorkout(); break;
    case 'cancelw': askConfirm('Laufendes Training abbrechen?', 'Abbrechen', () => { S.activeWorkout = null; S.timer = null; save(); hideTimerBar(); ui.wSub = 'today'; render(); }); break;

    // Sets & Exercises
    case 'dones': {
      const a = S.activeWorkout, exi = +ds.ex, ex = a.exs[exi], s = ex.sets[+ds.id];
      s.done = !s.done;
      if (s.done) {
        s.skip = false;
        if (!s.warm) {
          const L = load(ex, s.w), r = +s.r || 0, e1 = L * (1 + r/30), pr = currentPR(ex.name), isPR = (L > 0 && L > pr.maxW) || (r > 0 && e1 > pr.maxE && e1 > 0);
          if (isPR) { toast('🎉 Neuer Rekord bei ' + ex.name + '!'); if (navigator.vibrate) { try { navigator.vibrate([100, 50, 100]); } catch(e) {} } }
          startTimer(ex.rest || S.settings.rest || 90);
        }
      }
      save(); render(); break;
    }
    case 'aset': { const a = S.activeWorkout, ex = a.exs[+ds.ex], last = ex.sets[ex.sets.length-1]; ex.sets.push({ w: last ? last.w : 0, r: last ? last.r : 0, rpe: null, note: '', done: false, skip: false, warm: false }); save(); render(); break; }
    case 'exmodal': openModal(mExercise(ds.target)); break;
    case 'exadd': {
      const target = $('exTarget').value, name = ($('exName').value||'').trim();
      if (!name) { toast('Name eingeben'); return; }
      const unit = $('exUnit').value, bw = $('exBw').value;
      if (target === 'active' && S.activeWorkout) {
        S.activeWorkout.exs.push({ name, unit, bw, rest: S.settings.rest, sets: [{ w: 0, r: 10, done: false }] });
      } else {
        const r = S.routines.find(x => x.id === target);
        if (r) {
          const sets = parseInt($('exSets').value)||3, reps = parseInt($('exReps').value)||10, w = parseFloat($('exW').value)||0;
          r.exercises.push({ id: uid(), name, unit, bw, sets, reps, w, rest: S.settings.rest });
        }
      }
      save(); closeModal(); render(); toast('Übung hinzugefügt'); break;
    }
    case 'tplmodal': openModal(mTemplates(ds.id)); break;
    case 'tpladd': {
      const tplName = ds.id, target = ds.target, exs = TEMPLATES[tplName] || [];
      if (target === 'active' && S.activeWorkout) {
        exs.forEach(e => S.activeWorkout.exs.push({ name: e.name, unit: e.unit, bw: e.bw, rest: 90, sets: suggestSets(e) }));
      } else {
        const r = S.routines.find(x => x.id === target);
        if (r) exs.forEach(e => r.exercises.push({ id: uid(), name: e.name, unit: e.unit, bw: e.bw, sets: e.sets, reps: e.reps, w: e.w, rest: 90 }));
      }
      save(); closeModal(); render(); toast(`Vorlage "${tplName}" hinzugefügt`); break;
    }
    case 'newRoutinePrompt': {
      const name = prompt(curLang()==='de'?'Name des Trainingsplans:':'Routine name:');
      if (name && name.trim()) {
        const newR = { id: uid(), name: name.trim(), exercises: [] };
        S.routines.push(newR); save(); render(); toast('Plan erstellt');
      }
      break;
    }
    case 'openWorkoutLogDetail': {
      const l = S.workoutLogs.find(x => x.id === ds.id);
      if (l) {
        openModal(`
          <h3>${esc(l.name)}</h3>
          <p class="muted" style="font-size:13px;margin-bottom:12px">${l.date} · ${Math.round(cv(volOf(l), gu()))} ${gu()} Volumen</p>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${(l.exs||[]).map(e => `
              <div class="card card-sm">
                <b>${esc(e.name)}</b>
                <div class="muted" style="font-size:12px">${e.sets.filter(s=>s.done).map(s=>`${cv(s.w, gu())}${gu()} × ${s.r}`).join(' · ')}</div>
              </div>
            `).join('')}
          </div>`);
      }
      break;
    }

    // Food System
    case 'openFoodSearch': {
      ui.targetMeal = ds.meal || 'Breakfast';
      ui.fsQuery = '';
      ui.fsCat = 'All';
      ui.subpageType = 'foodSearch';
      openSubpage(foodSearchPageHTML());
      break;
    }
    case 'fsFilterCat': {
      ui.fsCat = ds.cat;
      openSubpage(foodSearchPageHTML());
      break;
    }
    case 'selectFoodItem': {
      const item = findFood(ds.id);
      if (item) {
        ui.selectedPortionItem = item;
        ui.portionGrams = item.servingG || 100;
        openModal(foodDetailPageHTML(item, ui.portionGrams, ui.targetMeal, null));
      }
      break;
    }
    case 'adjustPortion': {
      const diff = parseInt(ds.diff) || 0;
      ui.portionGrams = Math.max(5, (ui.portionGrams || 100) + diff);
      if (ui.selectedPortionItem) openModal(foodDetailPageHTML(ui.selectedPortionItem, ui.portionGrams, ui.targetMeal, null));
      break;
    }
    case 'setTargetMeal': {
      ui.targetMeal = ds.meal;
      if (ui.selectedPortionItem) openModal(foodDetailPageHTML(ui.selectedPortionItem, ui.portionGrams, ui.targetMeal, null));
      break;
    }
    case 'commitLogFood': {
      const item = findFood(ds.id) || ui.selectedPortionItem;
      if (!item) return;
      const g = ui.portionGrams || 100;
      const targetMeal = ui.targetMeal || 'Breakfast';
      const calc = calcFoodPortion(item, g);

      S.food[ui.fd] = S.food[ui.fd] || {};
      S.food[ui.fd][targetMeal] = S.food[ui.fd][targetMeal] || [];
      S.food[ui.fd][targetMeal].push({
        id: uid(), name: item.name, brand: item.brand, category: item.category,
        g, dbId: item.id, kcal: calc.kcal, carbs: calc.carbs, fat: calc.fat, protein: calc.protein,
        nutrients: calc.nutrients, done: true
      });
      save(); closeModal(); closeSubpage();
      ui.tab = 'food'; render();
      toast(`✓ ${g}g ${item.name} zu ${mealLabel(targetMeal)} hinzugefügt`);
      break;
    }
    case 'fdel': {
      if (S.food[ui.fd] && S.food[ui.fd][ds.meal]) {
        S.food[ui.fd][ds.meal] = S.food[ui.fd][ds.meal].filter(y => y.id !== id);
        save(); render();
      }
      break;
    }
    case 'openLoggedFoodDetail': {
      const arr = (S.food[ui.fd] && S.food[ui.fd][ds.meal]) || [];
      const item = arr.find(y => y.id === id);
      if (item) {
        ui.selectedPortionItem = item;
        ui.portionGrams = item.g;
        openModal(foodDetailPageHTML(item, item.g, ds.meal, item.id));
      }
      break;
    }
    case 'openDailyNutrients': openModal(mDailyNutrients(ds.date || ui.fd)); break;
    case 'fdnav': ui.fd = ds.id; render(); break;

    // Custom Foods CRUD
    case 'fdbmodal': openModal(mFoodItem(null)); break;
    case 'fdbedit': openModal(mFoodItem(id)); break;
    case 'fdbdel': {
      askConfirm('Dieses Lebensmittel löschen? Geloggte Mahlzeiten bleiben erhalten.', 'Löschen', () => {
        S.foodDb = S.foodDb.filter(x => x.id !== id);
        save();
        if ($('subpage').classList.contains('show')) openSubpage(foodSearchPageHTML());
        toast('Lebensmittel gelöscht');
      });
      break;
    }
    case 'fdbsave': {
      const fid = $('fdbId').value, name = ($('fdbName').value||'').trim();
      if (!name) { toast('Name eingeben'); return; }
      const nameEn = ($('fdbNameEn').value||'').trim();
      const brand = ($('fdbBrand').value||'').trim();
      const category = $('fdbCategory').value;
      const servingName = ($('fdbServingName').value||'').trim() || '1 Portion';
      const servingG = parseFloat($('fdbServingG').value) || 100;
      const kcal = parseFloat($('fdbKcal').value) || 0;
      const kj = parseFloat($('fdbKj') && $('fdbKj').value) || Math.round(kcal * 4.184);
      const carbs = parseFloat($('fdbCarbs').value) || 0;
      const protein = parseFloat($('fdbProtein').value) || 0;
      const fat = parseFloat($('fdbFat').value) || 0;

      const nutrients = {
        fiber: parseFloat($('fdb_fiber') && $('fdb_fiber').value) || null,
        sugar: parseFloat($('fdb_sugar') && $('fdb_sugar').value) || null,
        satFat: parseFloat($('fdb_satFat') && $('fdb_satFat').value) || null,
        salt: parseFloat($('fdb_salt') && $('fdb_salt').value) || null
      };

      if (fid) {
        const item = S.foodDb.find(x => x.id === fid);
        if (item) {
          Object.assign(item, { name, nameEn, brand, category, servingName, servingG, kcal, kj, carbs, protein, fat, nutrients });
        }
      } else {
        S.foodDb.push({
          id: uid(), name, nameEn, brand, category, servingName, servingG, kcal, kj, carbs, protein, fat, nutrients,
          sourceType: 'custom', source: 'Eigenes Lebensmittel', verified: false
        });
      }
      save(); closeModal();
      if ($('subpage').classList.contains('show')) openSubpage(foodSearchPageHTML());
      toast('Lebensmittel gespeichert ✅');
      break;
    }

    // Habits System & Full Management
    case 'openHabitsPage': ui.subpageType = 'habits'; openSubpage(habitsPageHTML()); break;
    case 'habmodal': openModal(mHabit(null)); break;
    case 'habedit': openModal(mHabit(id)); break;
    case 'habdetail': openModal(mHabitDetail(id)); break;
    case 'habdel': {
      askConfirm(t('delete_habit_confirm'), t('delete'), () => {
        S.habits.list = S.habits.list.filter(x => x.id !== id);
        save();
        if ($('subpage').classList.contains('show')) openSubpage(habitsPageHTML());
        render();
        toast('Gewohnheit gelöscht');
      });
      break;
    }
    case 'habdone': {
      const date = ds.date || dk();
      S.habits.log[date] = S.habits.log[date] || {};
      S.habits.log[date][id] = !S.habits.log[date][id];
      save();
      if ($('subpage').classList.contains('show')) openSubpage(habitsPageHTML());
      render();
      break;
    }
    case 'toggleHabDay': {
      b.classList.toggle('on');
      const container = b.parentElement;
      const onDays = Array.from(container.querySelectorAll('.day-pill.on')).map(x => parseInt(x.dataset.day));
      $('habDaysVal').value = onDays.join(',');
      break;
    }
    case 'habsave': {
      const hid = $('habId').value, name = ($('habName').value||'').trim();
      if (!name) { toast('Name eingeben'); return; }
      const emoji = $('habEmoji').value || '✅';
      const cat = $('habCat').value;
      const freq = $('habFreq').value;
      const daysStr = $('habDaysVal').value;
      const days = daysStr ? daysStr.split(',').map(x => parseInt(x)) : [1,2,3,4,5,6,7];

      if (hid) {
        const item = S.habits.list.find(x => x.id === hid);
        if (item) Object.assign(item, { name, emoji, cat, freq, days });
      } else {
        S.habits.list.push({ id: uid(), name, emoji, cat, freq, days, unit: 'check', target: 1, wtarget: 7 });
      }
      save(); closeModal();
      if ($('subpage').classList.contains('show')) openSubpage(habitsPageHTML());
      render();
      toast('Gewohnheit gespeichert ✅');
      break;
    }
    case 'hdnav': ui.hd = ds.id; openSubpage(habitsPageHTML()); break;

    // Interactive Analytics Controls
    case 'openProgressPage': ui.subpageType = 'progress'; openSubpage(progressPageHTML()); break;
    case 'pRange': ui.pRange = ds.id; ui.pOffset = 0; openSubpage(progressPageHTML()); break;
    case 'pNav': {
      ui.pOffset = Math.min(0, ui.pOffset + parseInt(ds.dir));
      openSubpage(progressPageHTML());
      break;
    }
    case 'chartPointDetail': {
      openModal(`
        <h3>Datenpunkt-Details</h3>
        <p class="muted" style="font-size:13px;margin-bottom:12px">${ds.date}</p>
        <div style="font-size:26px;font-weight:800;color:var(--ac);margin-bottom:4px">${ds.val} ${ds.unit || ''}</div>
        ${ds.label ? `<div class="muted" style="font-size:13px">${esc(ds.label)}</div>` : ''}
        <button class="btn btn-ghost" style="width:100%;margin-top:14px" data-action="close">${t('close')}</button>
      `);
      break;
    }
    case 'openStatDetail': {
      openModal(`
        <h3>${ds.stat === 'workouts' ? t('workouts_this_week') : t('volume_this_week')}</h3>
        <p class="muted" style="font-size:13px;margin-bottom:12px">${ui.pRange.toUpperCase()}</p>
        <div style="font-size:28px;font-weight:800;color:var(--ac);margin-bottom:6px">${ds.val}</div>
        <div class="muted" style="font-size:13px">Basierend auf deinen tatsächlich gespeicherten Trainingslogs.</div>
        <button class="btn btn-ghost" style="width:100%;margin-top:14px" data-action="close">${t('close')}</button>
      `);
      break;
    }
    case 'openPRDetail': {
      openModal(`
        <h3>Bestleistung: ${esc(ds.name)}</h3>
        <div style="font-size:26px;font-weight:800;color:var(--ac);margin:8px 0">${ds.w} ${gu()} × ${ds.r} Wdh</div>
        <button class="btn btn-ghost" style="width:100%;margin-top:10px" data-action="close">${t('close')}</button>
      `);
      break;
    }

    // Quick Trackers
    case 'logWater': {
      const today = dk(), cur = S.water[today] || 0;
      S.water[today] = Math.max(0, +(cur + parseFloat(ds.val)).toFixed(2));
      save(); render(); break;
    }
    case 'logSleep': {
      const today = dk(), cur = S.sleep[today] || 7.5;
      S.sleep[today] = Math.max(0, +(cur + parseFloat(ds.val)).toFixed(1));
      save(); render(); break;
    }
    case 'logSteps': {
      const today = dk(), cur = S.steps[today] || 6500;
      S.steps[today] = Math.max(0, cur + parseInt(ds.val));
      save(); render(); break;
    }

    // Calendar Navigation
    case 'calPrevMonth': {
      ui.calMonth--;
      if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; }
      render(); break;
    }
    case 'calNextMonth': {
      ui.calMonth++;
      if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; }
      render(); break;
    }
    case 'calToday': {
      const n = new Date();
      ui.calYear = n.getFullYear(); ui.calMonth = n.getMonth(); ui.calSelectedDay = dk();
      render(); break;
    }
    case 'calSelectDay': ui.calSelectedDay = ds.date; render(); break;

    // Backup & Restore
    case 'export': {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S, null, 2));
      const a = document.createElement('a'); a.setAttribute('href', dataStr);
      a.setAttribute('download', `momentum-backup-${dk()}.json`);
      document.body.appendChild(a); a.click(); a.remove();
      toast('Backup exportiert ✅'); break;
    }
    case 'import': $('impfile').click(); break;
  }
}

// Data input event handler
function onDataChange(e) {
  const el = e.target, ds = el.dataset, u = gu();
  switch(ds.change) {
    case 'bw': { const v = fk(el.value, u); if (v != null) { S.bodyweight[dk()] = v; S.settings.bw = v; } dsave(); break; }
    case 'rest': S.settings.rest = parseInt(el.value) || 90; dsave(); break;
    case 'goal': S.settings.goal = parseInt(el.value) || 4; dsave(); break;
    case 'goalKcal': S.settings.macroGoals.kcal = parseFloat(el.value) || 2200; dsave(); break;
    case 'goalCarbs': S.settings.macroGoals.carbs = parseFloat(el.value) || 250; dsave(); break;
    case 'goalProtein': S.settings.macroGoals.protein = parseFloat(el.value) || 150; dsave(); break;
    case 'goalFat': S.settings.macroGoals.fat = parseFloat(el.value) || 70; dsave(); break;
    case 'fsQuery': ui.fsQuery = el.value; openSubpage(foodSearchPageHTML()); break;
    case 'portionGrams': {
      ui.portionGrams = parseFloat(el.value) || 100;
      if (ui.selectedPortionItem) openModal(foodDetailPageHTML(ui.selectedPortionItem, ui.portionGrams, ui.targetMeal, null));
      break;
    }
    case 'rmw': ui.rm.w = el.value; syncInputs(); break;
    case 'rmr': ui.rm.r = el.value; syncInputs(); break;
    case 'setw': {
      if (S.activeWorkout) {
        const exi = +ds.ex, si = +ds.si;
        S.activeWorkout.exs[exi].sets[si].w = parseFloat(el.value) || 0;
        dsave();
      }
      break;
    }
    case 'setr': {
      if (S.activeWorkout) {
        const exi = +ds.ex, si = +ds.si;
        S.activeWorkout.exs[exi].sets[si].r = parseInt(el.value) || 0;
        dsave();
      }
      break;
    }
  }
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
function init() {
  applyTheme();
  const setAppH = () => {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-h', h + 'px');
  };
  setAppH();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setAppH);
    window.visualViewport.addEventListener('scroll', setAppH);
  }
  window.addEventListener('resize', setAppH);

  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });

  let tsx = 0, tsy = 0, tmoved = false, lastTapTs = 0;
  document.addEventListener('touchstart', e => { const t = e.touches[0]; if (!t) return; tsx = t.clientX; tsy = t.clientY; tmoved = false; }, { passive: true });
  document.addEventListener('touchmove', e => { const t = e.touches[0]; if (!t) return; if (Math.abs(t.clientX - tsx) > 10 || Math.abs(t.clientY - tsy) > 10) tmoved = true; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (tmoved) return;
    const ct = e.changedTouches && e.changedTouches[0]; if (!ct) return;
    const el = document.elementFromPoint(ct.clientX, ct.clientY); if (!el) return;
    if (el.id === 'modal') { lastTapTs = Date.now(); e.preventDefault(); closeModal(); return; }
    const hit = el.closest('[data-action],[data-pick-emoji]'); if (!hit || hit.disabled) return;
    lastTapTs = Date.now(); e.preventDefault(); handleClick({ target: hit });
  }, { passive: false });
  document.addEventListener('click', e => { if (Date.now() - lastTapTs < 500) return; handleClick(e); });

  document.addEventListener('input', e => {
    const t = e.target;
    if (!t || !t.dataset || !t.dataset.change) return;
    const key = '_lv_' + t.dataset.change;
    if (t[key] === t.value) return;
    t[key] = t.value;
    onDataChange(e);
  });
  document.addEventListener('change', e => {
    if (e.target && e.target.id === 'impfile') {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const obj = JSON.parse(rd.result);
          S = migrate(obj); save(); closeModal(); render();
          toast('Backup erfolgreich wiederhergestellt ✅');
        } catch(err) { toast('Ungültige Backup-Datei'); }
      };
      rd.readAsText(file); return;
    }
    if (!e.target || !e.target.dataset || !e.target.dataset.change) return;
    const t = e.target, key = '_lv_' + t.dataset.change, already = t[key] === t.value;
    t[key] = t.value; if (!already) onDataChange(e);
    if (!['rmw','rmr','fsQuery','portionGrams','setw','setr'].includes(t.dataset.change)) save();
  });

  $('modal').addEventListener('click', e => { if (Date.now() - lastTapTs < 500) return; if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('focusin', e => {
    const t = e.target; if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch(err) {} }, 300);
  });

  const flushSave = () => { dsave.flush(); save(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
  window.addEventListener('pagehide', flushSave);

  if (S.timer) renderTimerBar();
  render();
}

init();

</script>
